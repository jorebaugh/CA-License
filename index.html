<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}[hidden]{display:none!important}
/* Layout: single study column — control strip, one card at a time, answer below; built like a bridge watch card */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --ink:#11243A; --muted:#5A6B7C; --line:#D3DCE3;
  --accent:#0F6C83; --accent-ink:#FFFFFF; --good:#1E8A52; --good-bg:#E3F4EA; --bad:#B23A2E; --bad-bg:#FBE9E6;
  --both:#0F6C83; --inland:#6A4C93; --intl:#B0731A; --chip-bg:#E6EDF1;
  --display:"Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --body:-apple-system,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1621; --surface:#14212F; --ink:#E4ECF2; --muted:#93A4B4; --line:#24364A;
  --accent:#4FB3CC; --accent-ink:#06202A; --good:#5BD28F; --good-bg:#15301F; --bad:#F07F72; --bad-bg:#3A1A17;
  --both:#4FB3CC; --inland:#B49AE0; --intl:#E7B25A; --chip-bg:#1C2C3D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1621; --surface:#14212F; --ink:#E4ECF2; --muted:#93A4B4; --line:#24364A;
  --accent:#4FB3CC; --accent-ink:#06202A; --good:#5BD28F; --good-bg:#15301F; --bad:#F07F72; --bad-bg:#3A1A17;
  --both:#4FB3CC; --inland:#B49AE0; --intl:#E7B25A; --chip-bg:#1C2C3D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{font-family:var(--display);font-weight:700;font-size:2.1rem;letter-spacing:.01em;line-height:1;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.92rem;margin:4px 0 0}
.stats{font-family:var(--mono);font-size:.82rem;color:var(--muted);display:flex;gap:14px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
.controls{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;color:var(--muted);min-width:56px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:600 .88rem var(--body);padding:6px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select{font:600 .88rem var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.btn{font:600 .92rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
button:focus-visible,select:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 20px 18px;display:grid;gap:14px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.chip{font-family:var(--display);font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-size:.78rem;padding:2px 8px;border-radius:4px;background:var(--chip-bg)}
.chip.Both{color:var(--both)} .chip.Inland{color:var(--inland)} .chip.Intl{color:var(--intl)}
.chip.miss{color:var(--bad)} .chip.trouble{color:var(--intl)}

.q{font-size:1.18rem;font-weight:600;line-height:1.4;margin:0;text-wrap:pretty}
.opts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:400 1rem/1.4 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.opt .k{font-family:var(--mono);font-size:.85rem;color:var(--muted);padding-top:2px}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.answer{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:6px}
.answer .verdict{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.02em}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)} .verdict.neutral{color:var(--accent)}
.answer .a{font-weight:700}
.answer .ex{color:var(--ink);margin:0}
.answer .ref{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.actions .grp{display:flex;flex-wrap:wrap;gap:8px}
.hint{font-size:.8rem;color:var(--muted)}
.done{text-align:center;display:grid;gap:10px;justify-items:center}
.done .big{font-family:var(--display);font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
@media (max-width:480px){.q{font-size:1.06rem}.card{padding:16px 14px}.lbl{min-width:0;width:100%}}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>

</head><body>
<div class="wrap">
  <header>
    <div>
      <h1>Rules of the Road Drill</h1>
      <p class="sub">Your MLS Mastery Labs A–C and QuizMe questions, deduplicated. Inland and International tags match the exam.</p>
    </div>
    <div class="stats" aria-live="polite"><span>Session <b id="sScore">0/0</b></span><span>Trouble <b id="sTrouble">0</b></span></div>
  </header>

  <section class="controls" aria-label="Study settings">
    <div class="row"><span class="lbl">Mode</span>
      <div class="seg" id="modeSeg">
        <button type="button" data-v="quiz" aria-pressed="true">Quiz</button>
        <button type="button" data-v="flash" aria-pressed="false">Flashcards</button>
      </div>
    </div>
    <div class="row"><span class="lbl">Deck</span>
      <select id="srcSel" aria-label="Source quiz">
        <option value="all">All quizzes</option>
      </select>
      <div class="seg" id="tagSeg">
        <button type="button" data-v="all" aria-pressed="true">All</button>
        <button type="button" data-v="Both">Both</button>
        <button type="button" data-v="Inland">Inland</button>
        <button type="button" data-v="Intl">Intl</button>
      </div>
      <select id="setSel" aria-label="Card set">
        <option value="all">Every card</option>
        <option value="trouble">My trouble cards</option>
        <option value="missed">Missed on MLS</option>
      </select>
      <button type="button" class="btn" id="restart">Shuffle &amp; restart</button>
    </div>
  </section>

  <main id="stage"></main>
  <p class="hint">Keys: 1–4 pick an answer · Space flips or reveals · → next. "Again" adds a card to your trouble pile; "Got it" removes it.</p>
</div>

const CARDS = [{"src": "QuizMe", "tag": "Both", "q": "Another vessel remains on a steady bearing relative to your bow while the distance between you decreases. What condition should you assume exists?", "opts": ["Safe passing", "Overtaking from astern", "Risk of collision", "Restricted maneuverability"], "ans": "Risk of collision", "correct": 2, "expl": "A steady bearing with decreasing range is the primary indicator that risk of collision exists.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "A vessel less than 20 meters in length shall not impede:", "opts": ["A vessel that can safely navigate only within the narrow channel", "Any power-driven vessel", "A fishing vessel", "A sailing vessel"], "ans": "A vessel that can safely navigate only within the narrow channel", "correct": 0, "expl": "Small vessels shall not impede vessels navigating only within the channel.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "You observe two all-round white lights in a vertical line. What does this configuration most likely indicate?", "opts": ["Vessel at anchor less than 50 meters", "Vessel at anchor 50 meters or more in length", "Vessel constrained by draft", "Vessel not under command"], "ans": "Vessel at anchor 50 meters or more in length", "correct": 1, "expl": "A vessel 50 meters or more in length at anchor displays two all-round white lights. Note: this is MLS's keyed answer, but the wording is loose — real anchor lights are forward and aft (aft one lower), not a true vertical line. On the exam, 'two all-round whites, forward higher than aft' = anchored, 50 m or more.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "Which statement about the inshore traffic zone is correct?", "opts": ["It is intended for vessels at anchor", "A vessel under 20 meters, a sailing vessel, or a vessel engaged in fishing may use it", "Any vessel may use it at any time", "A power-driven vessel that can safely use the traffic lane must use the inshore zone instead"], "ans": "A vessel under 20 meters, a sailing vessel, or a vessel engaged in fishing may use it", "correct": 1, "expl": "The inshore traffic zone may be used by vessels under 20 meters, sailing vessels, and vessels engaged in fishing.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "While underway and in sight of another vessel, less than one half mile away, you put your engines on astern propulsion. Which statement concerning whistle signals is TRUE?", "opts": ["You must sound three short blasts on the whistle.", "You must sound whistle signals only if the vessels are meeting.", "You need not sound any whistle signals.", "You must sound one blast if backing to starboard."], "ans": "You must sound three short blasts on the whistle.", "correct": 0, "expl": "Rule 34(a): vessels in sight (Inland: within ½ mile) sound 3 short blasts when operating astern propulsion — whether meeting, crossing or overtaking.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "Which whistle signal indicates a doubt or uncertainty about another vessel's actions?", "opts": ["One short blast", "Five short blasts", "Three short blasts", "Two short blasts"], "ans": "Five short blasts", "correct": 1, "expl": "Rule 34(d): five or more short and rapid blasts = doubt/danger signal.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "Using the danger signal _______________________.", "opts": ["makes the other vessel the stand-on vessel", "indicates doubt as to another vessels actions", "replaces directional signals", "is the same as a \"MAYDAY\" signal"], "ans": "indicates doubt as to another vessels actions", "correct": 1, "expl": "The danger signal (5+ short) says 'I don't understand your intentions or doubt your action is enough.' It doesn't change who is stand-on and it isn't a distress signal.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "You are aboard the give-way vessel in a crossing situation. What should you NOT do in obeying the Rules?", "opts": ["Back your vessel", "Cross ahead of the stand-on vessel", "Slow your vessel", "Make a large course change to starboard"], "ans": "Cross ahead of the stand-on vessel", "correct": 1, "expl": "Rule 15: the give-way vessel shall, if circumstances admit, avoid crossing ahead of the stand-on vessel. Slowing, backing or a big turn to starboard are all fine.", "ref": "Unified Rule 16, Colregs Rule 15 and Inland vessel Rule 15(a)", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "You observe three masthead lights in a vertical line on a towing vessel. What does this indicate?", "opts": ["The tow exceeds 200 meters", "The vessel is constrained by draft", "The vessel is pushing ahead", "The tow is less than 200 meters"], "ans": "The tow exceeds 200 meters", "correct": 0, "expl": "Three masthead lights indicate a tow exceeding 200 meters.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "If risk of collision does not exist between two nearly reciprocal vessels:", "opts": ["Engines must be stopped", "A meeting maneuver is still required", "The meeting rules do not apply", "Alteration to starboard is mandatory"], "ans": "The meeting rules do not apply", "correct": 2, "expl": "If risk of collision does not exist, the meeting rules do not apply.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "In restricted visibility, the concepts of stand-on and give-way vessels:", "opts": ["Apply exactly as in sight situations", "Apply only to sailing vessels", "Do not apply", "Apply only at night"], "ans": "Do not apply", "correct": 2, "expl": "Stand-on and give-way hierarchy does not apply in restricted visibility.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "Risk of collision exists when an approaching vessel has a(n) __________.", "opts": ["generally steady bearing and decreasing range", "increasing range and bearing", "decreasing bearing only", "generally steady range and increasing bearing"], "ans": "generally steady bearing and decreasing range", "correct": 0, "expl": "Rule 7: a steady compass bearing with decreasing range (CBDR) means risk of collision.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "What is required of a vessel navigating near an area of restricted visibility?", "opts": ["A power-driven vessel shall have her engines ready for immediate maneuver.", "She must sound appropriate sound signals.", "If she detects another vessel by radar, she shall determine if risk of collision exists.", "All of the above"], "ans": "All of the above", "correct": 3, "expl": "Rule 19(b) and (d): in or near restricted visibility — safe speed, engines ready for immediate maneuver, fog signals, and assess radar contacts for risk of collision.", "ref": "Rule 19(b)", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "A vessel sounding a fog signal of one short, one prolonged, and one short blast is indicating that the vessel is __________________.", "opts": ["in distress", "at anchor", "not under command", "fishing"], "ans": "at anchor", "correct": 1, "expl": "Rule 35(g): a vessel at anchor may add short-prolonged-short (Morse 'R') to warn an approaching vessel. Hook: 'R' = 'Right here!'", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "A sailing vessel navigating within a narrow channel shall:", "opts": ["Always maintain stand-on status", "Not impede a vessel that can safely navigate only within the channel", "Keep to port", "Cross ahead if faster"], "ans": "Not impede a vessel that can safely navigate only within the channel", "correct": 1, "expl": "A sailing vessel shall not impede a vessel that can safely navigate only within the channel.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "A partly submerged vessel or object being towed, which is not readily noticeable, shall show __________.", "opts": ["a diamond shape", "two red lights in a vertical line", "yellow lights at each end", "a black ball"], "ans": "a diamond shape", "correct": 0, "expl": "Rule 24(g): an inconspicuous, partly submerged towed object shows a diamond at or near its after end (plus one forward if over 200 m long) and all-round white lights at night.", "ref": "Colregs 24(g)(i) and Inland Rule 24(g)(i)", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "A vessel being propelled both by sail and by engines is considered:", "opts": ["A special circumstance vessel", "Not covered", "A sailing vessel", "A power-driven vessel"], "ans": "A power-driven vessel", "correct": 3, "expl": "A vessel under sail and machinery is a power-driven vessel.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "When joining a traffic lane, a vessel shall:", "opts": ["Sound one prolonged blast", "Enter at as small an angle as practicable", "Enter at right angles", "Stop outside the lane"], "ans": "Enter at as small an angle as practicable", "correct": 1, "expl": "A vessel shall join a traffic lane at as small an angle as practicable.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "A vessel aground in restricted visibility shall sound:", "opts": ["The anchor bell signal only", "The anchor bell signal plus three distinct strokes before and after the rapid ringing", "One prolonged blast", "Two prolonged blasts"], "ans": "The anchor bell signal plus three distinct strokes before and after the rapid ringing", "correct": 1, "expl": "A vessel aground gives the anchor bell signal and adds three distinct strokes before and after the rapid ringing.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "You are approaching another vessel from more than 22.5 degrees abaft her beam. How is your vessel classified?", "opts": ["Meeting vessel", "Overtaking vessel", "Stand-on vessel", "Crossing vessel"], "ans": "Overtaking vessel", "correct": 1, "expl": "A vessel approaching from more than 22.5 degrees abaft the beam is considered an overtaking vessel.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "Power-driven vessels must keep out of the way of sailing vessels except __________.", "opts": ["when they are making more speed than the power-driven vessel", "when the sailing vessel is overtaking", "in a crossing situation", "on the Inland Waters of the United States"], "ans": "when the sailing vessel is overtaking", "correct": 1, "expl": "Rule 13 beats Rule 18: an overtaking vessel keeps clear no matter what type she is — even a sailboat overtaking a power vessel.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "In a crossing situation, a stand-on vessel which is forced to take action in order to avoid collision with a vessel on her own port side shall, if possible, avoid __________.", "opts": ["turning to starboard", "increasing speed", "decreasing speed", "turning to port"], "ans": "turning to port", "correct": 3, "expl": "Rule 17(c): a power-driven stand-on vessel taking action shall, if circumstances admit, NOT alter course to port for a vessel on her own port side.", "ref": "Rule 17(c)", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "What is a \"vessel restricted in her ability to maneuver\"?", "opts": ["A vessel fishing with a bottom trawl that must remain on course", "A large tanker that is being towed as a dead ship to dry dock", "A vessel servicing buoys", "A deep-draft vessel that can only navigate in a dredged channel"], "ans": "A vessel servicing buoys", "correct": 2, "expl": "Rule 3(g): RAM = restricted by the nature of her work, e.g., servicing buoys, dredging, surveying, diving ops.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Inland", "q": "You are operating a vessel that must stay within a narrow channel to be navigated safely. Another vessel is crossing your course from starboard to port. You do NOT think she will pass safely. You _______________________.", "opts": ["must sound the doubt signal", "may sound the doubt signal", "are required to back down", "should sound one short blast to indicate that you are holding course and speed"], "ans": "must sound the doubt signal", "correct": 0, "expl": "Inland Rule 9(d): the vessel confined to the channel SHALL sound the danger signal if in doubt about a crossing vessel's intentions. International says MAY — a classic Inland vs. Intl difference.", "ref": "Inland Rule 9(d)", "missed": true}, {"src": "QuizMe", "tag": "Both", "q": "While underway in fog, you hear a vessel ahead sound two prolonged blasts on the whistle. You should ____________________.", "opts": ["sound only fog signals until the other vessel is sighted", "sound whistle signals only if you change course", "not sound any whistle signals until the other vessel is sighted", "sound two blasts and change course to the left"], "ans": "sound only fog signals until the other vessel is sighted", "correct": 0, "expl": "Two prolonged = power-driven vessel underway but stopped. Maneuvering signals are only for vessels in sight, so keep sounding your fog signal until you see her.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "When navigating in restricted visibility, every vessel shall proceed at:", "opts": ["Safe speed adapted to the prevailing conditions", "Half speed at all times", "Maximum maneuvering speed", "Bare steerageway only"], "ans": "Safe speed adapted to the prevailing conditions", "correct": 0, "expl": "Safe speed must be maintained in restricted visibility.", "ref": "", "missed": false}, {"src": "QuizMe", "tag": "Both", "q": "You hear the fog signal of another vessel forward of your beam. Risk of collision may exist. You MUST __________.", "opts": ["stop your engines", "take all way off, if necessary", "begin a radar plot", "All of the above"], "ans": "take all way off, if necessary", "correct": 1, "expl": "Rule 19(e): hearing a fog signal forward of the beam — reduce to bare steerageway and, if necessary, take all way off.", "re const SRC_ORDER = ["Lab A · Foundation & Risk","Lab B · Encounters & Special Conditions","Lab C · Signals & Lights","QuizMe"];
const store = {

SRC_ORDER.forEach(s=>{const o=document.createElement("option");o.value=s;o.textContent=s;$("#srcSel").appendChild(o)});

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function lockedOrder(c){return c.opts.some(o=>/(all|none|both) of the above|^both [a-d]\b|^either/i.test(o))}

function build(){
  let pool = CARDS.filter(c=>(st.src==="all"||c.src===st.src)&&(st.tag==="all"||c.tag===st.tag));
  if(st.set==="trouble") pool = pool.filter(c=>trouble.has(c.id));
  if(st.set==="missed") pool = pool.filter(c=>c.missed);
  st.queue = shuffle(pool.map(c=>{
    const idx=c.opts.map((_,i)=>i); if(!lockedOrder(c)) shuffle(idx);
    return {c, order:idx};
  }));
  st.pos=0; st.right=0; st.seen=0; resetCard(); render();
}
function resetCard(){st.revealed=false; st.picked=null}
function stats(){
  $("#sScore").textContent = st.mode==="quiz" ? `${st.right}/${st.seen}` : `${Math.min(st.pos+ (st.revealed?1:0),st.queue.length)}/${st.queue.length}`;
  $("#sTrouble").textContent = trouble.size;
}
function setTrouble(id,on){on?trouble.add(id):trouble.delete(id);store.set("ror_trouble",[...trouble])}

  stage.querySelectorAll(".opt:not([disabled])").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  const f=$("#bFlip"); if(f) f.onclick=flip;
  const n=$("#bNext"); if(n) n.onclick=next;
  const a=$("#bAgain"); if(a) a.onclick=()=>{setTrouble(c.id,true);next()};
  const g=$("#bGot"); if(g) g.onclick=()=>{setTrouble(c.id,false);next()};
}
function pick(k){
  if(st.mode!=="quiz"||st.picked!==null||st.pos>=st.queue.length) return;
  const {c,order}=st.queue[st.pos];
  st.picked=k; st.seen++;
  if(order[k]===c.correct) st.right++; else setTrouble(c.id,true);
  render();
}
function flip(){ if(st.mode==="flash"&&!st.revealed){st.revealed=true;render()} }
function next(){ if(st.pos<st.queue.length){st.pos++;resetCard();render();window.scrollTo({top:0,behavior:"smooth"})} }

function seg(id,key){
  document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{st[key]=b.dataset.v; if(key==="mode") store.set("ror_mode",st.mode); syncControls(); build()});
}
function syncControls(){
  document.querySelectorAll("#modeSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===st.mode));
  document.querySelectorAll("#tagSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===st.tag));
  $("#srcSel").value=st.src; $("#setSel").value=st.set;
}
seg("modeSeg","mode"); seg("tagSeg","tag");
$("#srcSel").onchange=e=>{st.src=e.target.value;build()};
$("#setSel").onchange=e=>{st.set=e.target.value;build()};
$("#restart").onclick=build;
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT") return;
  if(/^[1-4]$/.test(e.key)) pick(+e.key-1);
  else if(e.key===" "){ e.preventDefault(); if(st.mode==="flash"&&!st.revealed) flip(); else next(); }
  else if(e.key==="ArrowRight"){ if(st.mode==="flash"&&!st.revealed) flip(); else if(st.mode==="flash"||st.picked!==null) next(); }
});
syncControls(); build();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body></html>
