<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}[hidden]{display:none!important}
/* Layout: single study column — control strip, one card at a time, answer below; built like a bridge watch card */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --ink:#11243A; --muted:#5A6B7C; --line:#D3DCE3;
  --accent:#0F6C83; --accent-ink:#FFFFFF; --good:#1E8A52; --good-bg:#E3F4EA; --bad:#B23A2E; --bad-bg:#FBE9E6;
  --both:#0F6C83; --inland:#6A4C93; --intl:#B0731A; --chip-bg:#E6EDF1;
  --display:"Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --body:-apple-system,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1621; --surface:#14212F; --ink:#E4ECF2; --muted:#93A4B4; --line:#24364A;
  --accent:#4FB3CC; --accent-ink:#06202A; --good:#5BD28F; --good-bg:#15301F; --bad:#F07F72; --bad-bg:#3A1A17;
  --both:#4FB3CC; --inland:#B49AE0; --intl:#E7B25A; --chip-bg:#1C2C3D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1621; --surface:#14212F; --ink:#E4ECF2; --muted:#93A4B4; --line:#24364A;
  --accent:#4FB3CC; --accent-ink:#06202A; --good:#5BD28F; --good-bg:#15301F; --bad:#F07F72; --bad-bg:#3A1A17;
  --both:#4FB3CC; --inland:#B49AE0; --intl:#E7B25A; --chip-bg:#1C2C3D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{font-family:var(--display);font-weight:700;font-size:2.1rem;letter-spacing:.01em;line-height:1;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.92rem;margin:4px 0 0}
.stats{font-family:var(--mono);font-size:.82rem;color:var(--muted);display:flex;gap:14px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
.controls{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;color:var(--muted);min-width:56px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:600 .88rem var(--body);padding:6px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select{font:600 .88rem var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.btn{font:600 .92rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
button:focus-visible,select:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 20px 18px;display:grid;gap:14px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.chip{font-family:var(--display);font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-size:.78rem;padding:2px 8px;border-radius:4px;background:var(--chip-bg)}
.chip.Both{color:var(--both)} .chip.Inland{color:var(--inland)} .chip.Intl{color:var(--intl)}
.chip.miss{color:var(--bad)} .chip.trouble{color:var(--intl)} .chip.sec{color:var(--ink)}
.topic{font-size:.82rem;color:var(--muted)}
.count{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums}
.q{font-size:1.18rem;font-weight:600;line-height:1.4;margin:0;text-wrap:pretty}
.opts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:400 1rem/1.4 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.opt .k{font-family:var(--mono);font-size:.85rem;color:var(--muted);padding-top:2px}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.answer{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:6px}
.answer .verdict{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.02em}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)} .verdict.neutral{color:var(--accent)}
.answer .a{font-weight:700}
.answer .ex{color:var(--ink);margin:0}
.answer .ref{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.actions .grp{display:flex;flex-wrap:wrap;gap:8px}
.hint{font-size:.8rem;color:var(--muted)}
.done{text-align:center;display:grid;gap:10px;justify-items:center}
.done .big{font-family:var(--display);font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
@media (max-width:480px){.q{font-size:1.06rem}.card{padding:16px 14px}.lbl{min-width:0;width:100%}}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>

</head><body>
<div class="wrap">
  <header>
    <div>
      <h1>CA License Study</h1>
      <p class="sub">OUPV captain's license drill: Rules of the Road, Deck General &amp; Safety, and Navigation General.</p>
    </div>
    <div class="stats" aria-live="polite"><span>Session <b id="sScore">0/0</b></span><span>Trouble <b id="sTrouble">0</b></span></div>
  </header>

  <section class="controls" aria-label="Study settings">
    <div class="row"><span class="lbl">Mode</span>
      <div class="seg" id="modeSeg">
        <button type="button" data-v="quiz" aria-pressed="true">Quiz</button>
        <button type="button" data-v="flash" aria-pressed="false">Flashcards</button>
      </div>
    </div>
    <div class="row"><span class="lbl">Module</span>
      <div class="seg" id="secSeg">
        <button type="button" data-v="all" aria-pressed="true">All</button>
        <button type="button" data-v="RR">Rules of Road</button>
        <button type="button" data-v="DGS">Deck Gen</button>
        <button type="button" data-v="NG">Nav Gen</button>
      </div>
    </div>
    <div class="row"><span class="lbl">Deck</span>
      <select id="srcSel" aria-label="Topic">
        <option value="all">All topics</option>
      </select>
      <div class="seg" id="tagSeg">
        <button type="button" data-v="all" aria-pressed="true">All</button>
        <button type="button" data-v="Both">Both</button>
        <button type="button" data-v="Inland">Inland</button>
        <button type="button" data-v="Intl">Intl</button>
      </div>
      <select id="setSel" aria-label="Card set">
        <option value="all">Every card</option>
        <option value="trouble">My trouble cards</option>
        <option value="missed">Missed on MLS</option>
        <option value="flag">Cards with a note</option>
      </select>
      <button type="button" class="btn" id="restart">Shuffle &amp; restart</button>
    </div>
  </section>

  <main id="stage"></main>
  <p class="hint">Keys: 1–4 pick an answer · Space flips or reveals · → next. "Again" adds a card to your trouble pile; "Got it" removes it.</p>
</div>

<script>
const CARDS = [{"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "Another vessel remains on a steady bearing relative to your bow while the distance between you decreases. What condition should you assume exists?", "opts": ["Safe passing", "Overtaking from astern", "Risk of collision", "Restricted maneuverability"], "correct": 2, "expl": "A steady bearing with decreasing range is the primary indicator that risk of collision exists.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "A vessel less than 20 meters in length shall not impede:", "opts": ["A vessel that can safely navigate only within the narrow channel", "Any power-driven vessel", "A fishing vessel", "A sailing vessel"], "correct": 0, "expl": "Small vessels shall not impede vessels navigating only within the channel.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "You observe two all-round white lights in a vertical line. What does this configuration most likely indicate?", "opts": ["Vessel at anchor less than 50 meters", "Vessel at anchor 50 meters or more in length", "Vessel constrained by draft", "Vessel not under command"], "correct": 1, "expl": "A vessel 50 meters or more in length at anchor displays two all-round white lights. Note: this is MLS's keyed answer, but the wording is loose — real anchor lights are forward and aft (aft one lower), not a true vertical line. On the exam, 'two all-round whites, forward higher than aft' = anchored, 50 m or more.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "Which statement about the inshore traffic zone is correct?", "opts": ["It is intended for vessels at anchor", "A vessel under 20 meters, a sailing vessel, or a vessel engaged in fishing may use it", "Any vessel may use it at any time", "A power-driven vessel that can safely use the traffic lane must use the inshore zone instead"], "correct": 1, "expl": "The inshore traffic zone may be used by vessels under 20 meters, sailing vessels, and vessels engaged in fishing.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "While underway and in sight of another vessel, less than one half mile away, you put your engines on astern propulsion. Which statement concerning whistle signals is TRUE?", "opts": ["You must sound three short blasts on the whistle.", "You must sound whistle signals only if the vessels are meeting.", "You need not sound any whistle signals.", "You must sound one blast if backing to starboard."], "correct": 0, "expl": "Rule 34(a): vessels in sight (Inland: within ½ mile) sound 3 short blasts when operating astern propulsion — whether meeting, crossing or overtaking.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "Which whistle signal indicates a doubt or uncertainty about another vessel's actions?", "opts": ["One short blast", "Five short blasts", "Three short blasts", "Two short blasts"], "correct": 1, "expl": "Rule 34(d): five or more short and rapid blasts = doubt/danger signal.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "Using the danger signal _______________________.", "opts": ["makes the other vessel the stand-on vessel", "indicates doubt as to another vessels actions", "replaces directional signals", "is the same as a \"MAYDAY\" signal"], "correct": 1, "expl": "The danger signal (5+ short) says 'I don't understand your intentions or doubt your action is enough.' It doesn't change who is stand-on and it isn't a distress signal.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "You are aboard the give-way vessel in a crossing situation. What should you NOT do in obeying the Rules?", "opts": ["Back your vessel", "Cross ahead of the stand-on vessel", "Slow your vessel", "Make a large course change to starboard"], "correct": 1, "expl": "Rule 15: the give-way vessel shall, if circumstances admit, avoid crossing ahead of the stand-on vessel. Slowing, backing or a big turn to starboard are all fine.", "ref": "Unified Rule 16, Colregs Rule 15 and Inland vessel Rule 15(a)", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "You observe three masthead lights in a vertical line on a towing vessel. What does this indicate?", "opts": ["The tow exceeds 200 meters", "The vessel is constrained by draft", "The vessel is pushing ahead", "The tow is less than 200 meters"], "correct": 0, "expl": "Three masthead lights indicate a tow exceeding 200 meters.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "If risk of collision does not exist between two nearly reciprocal vessels:", "opts": ["Engines must be stopped", "A meeting maneuver is still required", "The meeting rules do not apply", "Alteration to starboard is mandatory"], "correct": 2, "expl": "If risk of collision does not exist, the meeting rules do not apply.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "In restricted visibility, the concepts of stand-on and give-way vessels:", "opts": ["Apply exactly as in sight situations", "Apply only to sailing vessels", "Do not apply", "Apply only at night"], "correct": 2, "expl": "Stand-on and give-way hierarchy does not apply in restricted visibility.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "Risk of collision exists when an approaching vessel has a(n) __________.", "opts": ["generally steady bearing and decreasing range", "increasing range and bearing", "decreasing bearing only", "generally steady range and increasing bearing"], "correct": 0, "expl": "Rule 7: a steady compass bearing with decreasing range (CBDR) means risk of collision.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "What is required of a vessel navigating near an area of restricted visibility?", "opts": ["A power-driven vessel shall have her engines ready for immediate maneuver.", "She must sound appropriate sound signals.", "If she detects another vessel by radar, she shall determine if risk of collision exists.", "All of the above"], "correct": 3, "expl": "Rule 19(b) and (d): in or near restricted visibility — safe speed, engines ready for immediate maneuver, fog signals, and assess radar contacts for risk of collision.", "ref": "Rule 19(b)", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "A vessel sounding a fog signal of one short, one prolonged, and one short blast is indicating that the vessel is __________________.", "opts": ["in distress", "at anchor", "not under command", "fishing"], "correct": 1, "expl": "Rule 35(g): a vessel at anchor may add short-prolonged-short (Morse 'R') to warn an approaching vessel. Hook: 'R' = 'Right here!'", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "A sailing vessel navigating within a narrow channel shall:", "opts": ["Always maintain stand-on status", "Not impede a vessel that can safely navigate only within the channel", "Keep to port", "Cross ahead if faster"], "correct": 1, "expl": "A sailing vessel shall not impede a vessel that can safely navigate only within the channel.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "A partly submerged vessel or object being towed, which is not readily noticeable, shall show __________.", "opts": ["a diamond shape", "two red lights in a vertical line", "yellow lights at each end", "a black ball"], "correct": 0, "expl": "Rule 24(g): an inconspicuous, partly submerged towed object shows a diamond at or near its after end (plus one forward if over 200 m long) and all-round white lights at night.", "ref": "Colregs 24(g)(i) and Inland Rule 24(g)(i)", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "A vessel being propelled both by sail and by engines is considered:", "opts": ["A special circumstance vessel", "Not covered", "A sailing vessel", "A power-driven vessel"], "correct": 3, "expl": "A vessel under sail and machinery is a power-driven vessel.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "When joining a traffic lane, a vessel shall:", "opts": ["Sound one prolonged blast", "Enter at as small an angle as practicable", "Enter at right angles", "Stop outside the lane"], "correct": 1, "expl": "A vessel shall join a traffic lane at as small an angle as practicable.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "A vessel aground in restricted visibility shall sound:", "opts": ["The anchor bell signal only", "The anchor bell signal plus three distinct strokes before and after the rapid ringing", "One prolonged blast", "Two prolonged blasts"], "correct": 1, "expl": "A vessel aground gives the anchor bell signal and adds three distinct strokes before and after the rapid ringing.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "You are approaching another vessel from more than 22.5 degrees abaft her beam. How is your vessel classified?", "opts": ["Meeting vessel", "Overtaking vessel", "Stand-on vessel", "Crossing vessel"], "correct": 1, "expl": "A vessel approaching from more than 22.5 degrees abaft the beam is considered an overtaking vessel.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "Power-driven vessels must keep out of the way of sailing vessels except __________.", "opts": ["when they are making more speed than the power-driven vessel", "when the sailing vessel is overtaking", "in a crossing situation", "on the Inland Waters of the United States"], "correct": 1, "expl": "Rule 13 beats Rule 18: an overtaking vessel keeps clear no matter what type she is — even a sailboat overtaking a power vessel.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "In a crossing situation, a stand-on vessel which is forced to take action in order to avoid collision with a vessel on her own port side shall, if possible, avoid __________.", "opts": ["turning to starboard", "increasing speed", "decreasing speed", "turning to port"], "correct": 3, "expl": "Rule 17(c): a power-driven stand-on vessel taking action shall, if circumstances admit, NOT alter course to port for a vessel on her own port side.", "ref": "Rule 17(c)", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "What is a \"vessel restricted in her ability to maneuver\"?", "opts": ["A vessel fishing with a bottom trawl that must remain on course", "A large tanker that is being towed as a dead ship to dry dock", "A vessel servicing buoys", "A deep-draft vessel that can only navigate in a dredged channel"], "correct": 2, "expl": "Rule 3(g): RAM = restricted by the nature of her work, e.g., servicing buoys, dredging, surveying, diving ops.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Inland", "q": "You are operating a vessel that must stay within a narrow channel to be navigated safely. Another vessel is crossing your course from starboard to port. You do NOT think she will pass safely. You _______________________.", "opts": ["must sound the doubt signal", "may sound the doubt signal", "are required to back down", "should sound one short blast to indicate that you are holding course and speed"], "correct": 0, "expl": "Inland Rule 9(d): the vessel confined to the channel SHALL sound the danger signal if in doubt about a crossing vessel's intentions. International says MAY — a classic Inland vs. Intl difference.", "ref": "Inland Rule 9(d)", "missed": true, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "While underway in fog, you hear a vessel ahead sound two prolonged blasts on the whistle. You should ____________________.", "opts": ["sound only fog signals until the other vessel is sighted", "sound whistle signals only if you change course", "not sound any whistle signals until the other vessel is sighted", "sound two blasts and change course to the left"], "correct": 0, "expl": "Two prolonged = power-driven vessel underway but stopped. Maneuvering signals are only for vessels in sight, so keep sounding your fog signal until you see her.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "When navigating in restricted visibility, every vessel shall proceed at:", "opts": ["Safe speed adapted to the prevailing conditions", "Half speed at all times", "Maximum maneuvering speed", "Bare steerageway only"], "correct": 0, "expl": "Safe speed must be maintained in restricted visibility.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "You hear the fog signal of another vessel forward of your beam. Risk of collision may exist. You MUST __________.", "opts": ["stop your engines", "take all way off, if necessary", "begin a radar plot", "All of the above"], "correct": 1, "expl": "Rule 19(e): hearing a fog signal forward of the beam — reduce to bare steerageway and, if necessary, take all way off.", "ref": "Rule 19(e)", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "A vessel not under command in restricted visibility shall sound:", "opts": ["One prolonged blast", "Two prolonged blasts", "One prolonged followed by two short blasts", "Three short blasts"], "correct": 2, "expl": "A vessel not under command sounds one prolonged blast followed by two short blasts.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Inland", "q": "A vessel proceeding downstream in a narrow channel on the Great Lakes, Western Rivers, or waters specified by the Secretary, sees another vessel moving upstream. Which vessel has the right of way?", "opts": ["The vessel located more towards the channel center line", "The vessel moving upstream against the current", "The vessel sounding the first whistle signal", "The vessel moving downstream with a following current"], "correct": 3, "expl": "Inland Rule 9(a)(ii): on Great Lakes, Western Rivers and specified waters, the downbound vessel with a following current has the right-of-way and proposes the passage.", "ref": "Inland Rule 9(a)(ii)", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "If there is any doubt whether risk of collision exists:", "opts": ["Sound one prolonged blast", "Assume risk does not exist", "Assume risk exists", "Maintain course until certain"], "correct": 2, "expl": "If there is any doubt, risk of collision shall be deemed to exist.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "Two barges are being pushed ahead by a tugboat. Which statement is TRUE concerning lights on the barges?", "opts": ["Each vessel should show at least one white light.", "The barges should be lighted as separate units.", "The barges should be lighted as one vessel.", "Each vessel should show sidelights."], "correct": 2, "expl": "Barges pushed ahead are lighted as one vessel (Rule 24(h) / Inland 24(f)); a rigidly connected composite unit is lighted as a single power-driven vessel.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "During daylight hours, a vessel aground must exhibit __________.", "opts": ["three black balls displayed vertically", "three black cones in a triangle", "two cones with their apexes together", "one black ball"], "correct": 0, "expl": "Rule 30(d): aground by day = three balls in a vertical line. Hook: 1 ball anchored, 2 NUC, 3 aground.", "ref": "Rule 30(d)", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "In which situation do the Rules require both vessels to change course?", "opts": ["Two power-driven vessels meeting head-on", "Two power-driven vessels crossing when it is apparent to the stand-on vessel that the give-way vessel is not taking appropriate action", "Two sailing vessels crossing with the wind on the same side", "All of the above"], "correct": 0, "expl": "Rule 14: head-on is the only situation where BOTH vessels must alter course — each to starboard.", "ref": "Colregs Rule 14(a) and Inland Rule on 14(a)", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Inland", "q": "You are operating a power-driven vessel in a narrow channel, with a following current, on the Western Rivers, and are meeting an upbound vessel. Which statement is TRUE?", "opts": ["The downbound vessel is not required initiate the required maneuvering signals.", "The upbound vessel has the right-of-way.", "The downbound vessel shall not propose the manner and place of passage.", "The downbound vessel has the right-of-way."], "correct": 3, "expl": "Inland Rule 9(a)(ii): downbound with a following current has the right-of-way on Western Rivers.", "ref": "Inland Rule 9(a)(ii)", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "A sailing vessel underway may exhibit:", "opts": ["Only an all-round white light", "Sidelights and sternlight", "Two masthead lights", "A masthead light and sternlight only"], "correct": 1, "expl": "A sailing vessel underway displays sidelights and a sternlight.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "When vessels are in sight of one another and risk of collision exists, action taken shall be:", "opts": ["Early and substantial", "Limited to speed changes only", "Delayed until close quarters", "Slight and gradual"], "correct": 0, "expl": "Action to avoid collision must be early and substantial.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "A stand-on vessel in a crossing situation is allowed to take action when __________.", "opts": ["it becomes apparent to her that the give-way vessel is not taking appropriate action", "on a collision course", "the vessels will pass within one mile", "the relative speed of the vessels indicates collision in less than six minutes"], "correct": 0, "expl": "Rule 17(a)(ii): the stand-on vessel MAY act once it's apparent the give-way vessel isn't taking appropriate action (sound 5+ short first).", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "A vessel is considered to be \"restricted in her ability to maneuver\" under the Rules if she is __________.", "opts": ["a vessel dredging", "at anchor", "engaged in towing", "engaged in fishing"], "correct": 0, "expl": "Rule 3(g): dredging is a RAM operation (by nature of the work).", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Both", "q": "The primary purpose of a traffic separation scheme is to:", "opts": ["Provide anchorage areas", "Replace right-of-way rules", "Separate opposing streams of traffic", "Reduce draft restrictions"], "correct": 2, "expl": "Traffic separation schemes are designed to separate opposing streams of traffic to reduce collision risk.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "QuizMe", "tag": "Intl", "q": "In a narrow channel, an overtaking vessel, which intends to PASS on the other vessel's port side would sound________________.", "opts": ["two prolonged followed by two short blasts", "one prolonged followed by two short blasts", "one short blast", "two short blasts"], "correct": 0, "expl": "International Rule 34(c): in a narrow channel, 2 prolonged + 2 short = I intend to overtake on bt, whether a meeting situation exists:", "opts": ["Assume crossing", "Assume meeting", "Maintain speed", "Alter to port"], "correct": 1, "expl": "When in doubt whether a meeting situation exists, it shall be assumed to exist.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "Lab B · Encounters & Special Conditions", "tag": "Both", "q": "At night, you observe only the sternlight of another vessel directly ahead. What does this indicate?", "opts": ["Crossing situation", "Meeting situation", "Overtaking situation", "Vessel at anchor"], "correct": 2, "expl": "Seeing only the sternlight indicates you are approaching from abaft the beam, which defines an overtaking situation.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "Lab B · Encounters & Special Conditions", "tag": "Both", "q": "While operating in a narrow channel or fairway, which statement is correct regarding anchoring?", "opts": ["Only vessels constrained by draft should avoid anchoring", "Only small vessels should avoid anchoring", "Vessels shall, if circumstances permit, avoid anchoring in the channel", "Anchoring is prohibited at all times"], "correct": 2, "expl": "A vessel shall, if the circumstances of the case admit, avoid anchoring in a narrow channel or fairway.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "Lab B · Encounters & Special Conditions", "tag": "Both", "q": "The stand-on vessel’s responsibility during the early stage of a developing situation is to:", "opts": ["Yield to larger vessels", "Always alter to starboard", "Never maneuver", "Maintain course and speed, but be prepared to act"], "correct": 3, "expl": "The stand-on vessel maintains course and speed initially but must remain prepared to act if required.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "Lab B · Encounters & Special Conditions", "tag": "Both", "q": "In a crossing situation, the give-way vessel should take action that is:", "opts": ["Hesitant", "Early and substantial", "Slight", "Delayed"], "correct": 1, "expl": "Collision-avoidance action must be taken early and be substantial.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "Lab B · Encounters & Special Conditions", "tag": "Both", "q": "A vessel shall avoid anchoring in a traffic separation scheme unless:", "opts": ["She is under 20 meters", "She is crossing", "Compelled by circumstances", "Traffic density is light"], "correct": 2, "expl": "Anchoring within a traffic separation scheme should be avoided unless circumstances compel it.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "Lab B · Encounters & Special Conditions", "tag": "Both", "q": "As the stand-on vessel in a crossing situation, which maneuver is generally discouraged when taking action?", "opts": ["Reducing speed", "Altering course to starboard", "Altering course to port for a vessel on your port side", "Taking substantial action"], "correct": 2, "expl": "The stand-on vessel should not alter course to port for a vessel on her own port side except when necessary to avoid immediate danger.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "Lab B · Encounters & Special Conditions", "tag": "Both", "q": "A vessel engaged in fishing within a traffic separation scheme shall not:", "opts": ["Cross the traffic lane", "Impede a vessel following a traffic lane", "Operate at night", "Use the traffic lane"], "correct": 1, "expl": "A vessel engaged in fishing shall not impede vessels following a traffic lane.", "ref": "", "missed": false, "flag": false}, {"sec": "RR", "topic": "Lab B · Encounters & Special Conditions", "tag": "Both", "q": "In restricted visibility, engines shall be:", "opts": ["Secured", "Maintained at full ahead", "Ready for immediate maneuver", "Used only after sounding signals"], "correct": 2, "expl": "In restricted visibility, engines must be ready for immediate maneuver.", "ref": "", "missed": false, "flag": false}, { alse, "flag": false}, {"sec": "DGS", "topic": "Pollution Prevention", "tag": "", "q": "You are operating on Inland Waters of the United States. You may discharge overboard ______________.", "opts": ["dunnage", "bottles", "metal", "it is illegal to dump waste on Inland Waterways."], "correct": 3, "expl": "Garbage discharge into U.S. inland waters (including the Great Lakes) is prohibited.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Pollution Prevention", "tag": "", "q": "MARPOL regulations require that garbage discharged from vessels that are located between 3 and 12 nautical miles from the nearest land must be ground to less than...", "opts": ["1\"", "1-1/4\"", "2\"", "1-1/2\""], "correct": 0, "expl": "Comminuted food waste must pass through a 25 mm (1 inch) screen to be discharged in that zone.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Pollution Prevention", "tag": "", "q": "If you see an oil spill on the water you must report it to the _____________________.", "opts": ["local fire department", "U.S. Corps of Engineers", "local police", "U.S. Coast Guard National Response Center"], "correct": 3, "expl": "All oil sightings/discharges go to the National Response Center (USCG), 1-800-424-8802.", "ref": "", "missed": true, "flag": false}, {"sec": "DGS", "topic": "Pollution Prevention", "tag": "", "q": "If you do not notify the Coast Guard of an oil spill, you may be imprisoned up to ____________.", "opts": ["2 years", "5 years", "3 years", "1 year"], "correct": 1, "expl": "Under the Clean Water Act (33 USC 1321), failure to report can mean fines and up to 5 years' imprisonment.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Pollution Prevention", "tag": "", "q": "When cleaning up an oil spill, straw is an example of a ___________________.", "opts": ["pollutant", "blocker", "chemical agent", "sorbent"], "correct": 3, "expl": "Sorbents soak up oil -- straw, pads and booms are common examples.", "ref": "", "missed": true, "flag": false}, {"sec": "DGS", "topic": "Engines & Fueling Safety", "tag": "", "q": "The shut-off valve at the gasoline tank can be operated from outside the tank space _______________________.", "opts": ["Controls the amount of gasoline to the engine", "Shuts off the gasoline supply at the tank", "Is used if the gasoline tank leaks", "All of the above"], "correct": 1, "expl": "The tank shut-off lets you stop the fuel supply at its source, e.g., during a fire or line leak, without entering the compartment. It's an on/off valve, not a throttle.", "ref": "", "missed": true, "flag": false}, {"sec": "DGS", "topic": "Engines & Fueling Safety", "tag": "", "q": "When a gasoline engine will not start but turns over freely, the cause is generally _______________________.", "opts": ["A defective ignition system", "Too heavy a load", "Weak valve springs", "Low lube oil level"], "correct": 0, "expl": "Free cranking means the mechanicals are fine, so look at spark (ignition) first, then fuel.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Engines & Fueling Safety", "tag": "", "q": "While fueling, the nozzle of a gasoline hose or can should be kept __________________________.", "opts": ["in contact with the fill opening to guard against static spark", "from making contact with the fill opening to guard against static spark", "None of the above", "in contact with the fill opening to allow proper venting"], "correct": 0, "expl": "Metal-to-metal contact grounds the nozzle to the fill pipe, so static charge can't jump as a spark into the vapors.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Engines & Fueling Safety", "tag": "", "q": "Gasoline tanks should be filled...", "opts": ["With only sufficient fuel for the planned trip so excess gasoline is not carried", "To the top so the operator is certain how much fuel he has aboard", "To the top to expel all vapors from the tanks", "To near the top with some space allowed for gasoline expansion"], "correct": 3, "expl": "Gasoline expands as it warms; leaving a little space prevents overflow through the vent and spills.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Engines & Fueling Safety", "tag": "", "q": "How should the exhaust of a properly operating diesel engine appear?", "opts": ["Light brown haze", "Light blue haze", "Clear", "Light gray haze"], "correct": 2, "expl": "Healthy diesel exhaust is nearly invisible. Black smoke means too much fuel or too little air, blue means burning oil, white means water or unburned fuel.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": null, "tag": "", "q": "When fueling your vessel has been completed _____________________.", "opts": ["all hatches should be opened and all compartments should be ventilated", "the engine should be started immediately to prevent vapor lock in the fuel line", "the fuel tank fill pipe should be left open to allow vapors to vent from the tank", "open the fuel line and drain a small amount of gasoline into the bilge to clear the line of sediment"], "correct": 0, "expl": "", "ref": "", "missed": false, "flag": false, "quiz": "Lesson 3 - Quiz"}, {"sec": "DGS", "topic": "Engines & Fueling Safety", "tag": "", "q": "Your vessel has a gasoline engine and a mechanical exhaust ventilation system. BEFORE starting the engine, the exhaust blower should be run long enough to _______________.", "opts": ["insure at least one complete change of air in the compartments concerned", "provide a proper supply of fresh air for the engine(s)", "warm up the exhaust blower motor", "see the system is in good operating condition"], "correct": 0, "expl": "The goal is a full air change to purge heavier-than-air gasoline vapors; the usual rule is at least 4 minutes of blower time.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Engines & Fueling Safety", "tag": "", "q": "In general, the fuel injected into a marine diesel engine combustion chamber is ignited by _________________.", "opts": ["heat of compression", "a magneto", "glow plugs", "spark plugs"], "correct": 0, "expl": "Diesels are compression-ignition engines: squeezing the air makes it hot enough to ignite injected fuel. Glow plugs only assist cold starts.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Engines & Fueling Safety", "tag": "", "q": "When troubleshooting the cause of a gasoline engine's failure to start, you should _____________________.", "opts": ["disconnect the wires at the spark plugs and make the spark jump the gap", "break the joint in the fuel line at the engine and let the gas run in the bilges", "check the battery, spark plugs, carburetor, and fuel line", "prime the engine through the spark plug openings"], "correct": 2, "expl": "Work systematically through electrical and fuel components. Making open sparks or spilling gas in the bilge risks an explosion.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Engines & Fueling Safety", "tag": "", "q": "On most vessels gasoline fumes tend to __________________________.", "opts": ["disperse into the atmosphere", "settle evenly throughout all levels of the bilge by mixing with air", "settle near the bottom of the bilge", "settle near the top of the bilge"], "correct": 2, "expl": "Gasoline vapor is heavier than air, so it sinks and pools in the lowest part of the bilge, which is why blowers draw from low down.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "Which statement below is TRUE about an approved immersion suit?", "opts": ["The primary color of the suit's exterior may be red, orange or yellow.", "The suit may be stored in a machinery space where the ambient temperature is 160 degrees.", "The suite is flameproof and provides protection to a wearer swimming in burning oil.", "The suit must, without assistance, turn an unconscious person's mouth clear of water within 5 seconds."], "correct": 3, "expl": "Approved suits must self-right an unconscious person to a face-up position within about 5 seconds. They must be highly visible orange-type color (not red), are not flameproof, and heat degrades them.", "ref": "", "missed": true, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "While underway an inflatable liferaft is thrown into the water from a sinking vessel. What occurs automatically after the painter trips the CO2 bottles to inflate the raft?", "opts": ["The sea anchor deploys", "If upside down, the craft rights itself", "The painter detaches from the raft", "The floor inflates"], "correct": 0, "expl": "The sea anchor (drogue) streams out automatically on inflation to reduce drift and help stability. Righting a capsized raft and inflating the floor are done by the occupants; the painter must be cut.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "The lights on the outside of the canopy on an inflatable liferaft operate _________.", "opts": ["by a light sensor", "automatically when the raft is inflated", "by turning the globe clockwise", "by a switch by each light"], "correct": 1, "expl": "The canopy lights are water-activated/inflation-activated so they come on by themselves once the raft is deployed, making it visible at night without any action by survivors.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "Which vessel is required to carry onboard a Category I, 406 MHz EPIRB?", "opts": ["A vessel operating on the high seas or beyond 3 miles from the coastline of the Great Lakes", "A vessel limited to 20 miles offshore, which carries a radiotelephone on board", "A vessel limited to 100 miles offshore", "A vessel operating exclusively on inland waters"], "correct": 0, "expl": "USCG rules require a float-free, auto-activating Category I 406 MHz EPIRB for vessels on the high seas or beyond 3 nm from the Great Lakes shore.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "A Type III personal flotation device is primarily intended for _______________.", "opts": ["serving exclusively as a throwable buoyant aid", "protected inland waters where quick rescue is expected and mobility is important", "use in offshore open water where rescue may be delayed", "self-righting an unconscious wearer without any effort"], "correct": 1, "expl": "Type III 'flotation aids' are comfortable and allow movement but won't reliably turn an unconscious person face-up, so they suit protected waters with fast rescue. Type I is for offshore.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "If possible, what should you do when boarding a liferaft?", "opts": ["Not board the liferaft directly from the sinking vessel", "Avoid entering the water if possible", "Ask for permission to board", "None of the above"], "correct": 1, "expl": "Board dry if you can: staying out of the water preserves body heat and greatly improves survival odds against hypothermia.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "An USCG-approved immersion suit must be equipped with a(n) __________________________.", "opts": ["orange smoke canister", "air bottle for breathing", "whistle, light and retroreflective material", "sea dye marker"], "correct": 2, "expl": "Approved suits carry a whistle, a PFD light, and retroreflective material so a person in the water can be heard and seen day or night.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "The Master in charge of the vessel shall ensure that the Emergency Position Indicating Radio Beacon is ______________.", "opts": ["tested annually", "secured inside the wheelhouse", "tested monthly", "secured in the emergency locker"], "correct": 2, "expl": "Regulations call for a monthly self-test of the EPIRB using its test function (and checking battery and hydrostatic release dates). It must be stowed to float free, not locked away.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "Which statement is TRUE concerning Type I personal flotation devices?", "opts": ["Life preservers must always be worn with the same side facing outwards to float properly", "Buoyant vests may be substituted for life jackets", "Lightly stained or faded life jackets will fail in the water and should not be used", "Life preservers are designed to turn an unconscious person's face clear of the water"], "correct": 3, "expl": "Type I offshore life jackets give the most buoyancy and are designed to turn most unconscious wearers face-up. Most are reversible, and fading alone doesn't make them unserviceable.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "Who should inspect and test an inflatable liferaft?", "opts": ["Shipyard personal", "A certified lifeboatman", "The person in charge", "A Coast Guard approved servicing facility"], "correct": 3, "expl": "Inflatable rafts must be serviced (typically annually) at a Coast Guard approved servicing facility; the crew should not open the canister.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "Which statement is true about personal floatation devices (PFDs)?", "opts": ["All PFDs provide the same amount of floatation", "They must be Coast Guard-approved", "One Size fits all", "They are considered \"readily accessible\" if stored in their original packaging"], "correct": 1, "expl": "Only USCG-approved PFDs count toward carriage requirements. Buoyancy and sizing vary, and a PFD sealed in its plastic wrap is not readily accessible.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "Every life jacket light that has a non-replaceable power source must be replaced _________________.", "opts": ["every 12 months after initial installation", "every 24 months after initial installation", "every six months after the initial installation", "on or before the expiration date of the power source"], "correct": 3, "expl": "If the battery isn't replaceable, the whole light is replaced by the battery's marked expiration date.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "While on watch you find an inflatable liferaft container with steel bands around the case, you should _______________.", "opts": ["tell the Master", "leave the bands in place", "remove the bands yourself", "tell the Mate"], "correct": 1, "expl": "Per the exam bank, the bands stay on: they hold the canister halves together and are designed to part when the raft inflates. Don't tamper with the raft's packing.", "ref": "", "missed": true, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "What does the acronym \"EPIRB\" stand for?", "opts": ["Emergency Position Indicating Radiobeacon", "Emergency Position Indicating Radar Buoy", "Electronic Pulse Indicating Radiobeacon", "Position Indicating Radio Beacon"], "correct": 0, "expl": "Emergency Position Indicating Radio Beacon: it transmits a 406 MHz distress signal with your ID (and GPS position, if equipped) via COSPAS-SARSAT satellites.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "What safety device prevents an inflatable liferaft from being pulled under by a vessel which sinks in water over 100 feet in depth?", "opts": ["A Rottmer release", "The hydrostatic release", "Nothing", "The weak link in the sea painter line"], "correct": 3, "expl": "The hydrostatic release frees the canister and the painter tension inflates the raft; then the weak link snaps so the buoyant raft isn't pulled under with the ship.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "Which statement about immersion suits is true?", "opts": ["The immersion suite seals in body heat and provides protection against hypoglycemia for weeks.", "The suite is flameproof and provides protection to the wearer while swimming through burning oil.", "Prior to abandonment, the suit allows body movement such as walking, climbing a ladder and picking up small objects.", "The wearer of the suite is severely restricted and requires 1.5 times more time to climb a ladder than without the suit."], "correct": 2, "expl": "Approved suits must let the wearer move about, climb ladders, and handle small objects. They fight hypothermia (not hypoglycemia) and are not fireproof.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "On an approved inflatable liferaft, the knife will always be located ______________________.", "opts": ["in one of the equipment bags", "on a cord hanging from the canopy", "in a pocket on the first aid kit", "in a special pocket near the forward entrance"], "correct": 3, "expl": "The safety knife sits in a pocket by the entrance (near the painter attachment) so the first person aboard can cut the painter free quickly.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "A liferaft has been installed on your vessel. The operating cord should be ___________.", "opts": ["faked on the deck and lead through the deck", "coiled neatly on the raft container", "checked to see that it's unattached", "attached to the raft stowage cradle or to a secure object nearby with a float-free link (weak link)"], "correct": 3, "expl": "The painter is secured to the vessel via a weak link so it can pull the inflation trigger when the raft floats free, then break before the ship drags the raft down.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "Emergency Position Indicating Radiobeacons are limited to __________________.", "opts": ["Mayday-type emergencies", "use on commercial vessels", "only being activated by the Master of the vessel", "operations only when daylight activates the photovoltaic cell"], "correct": 0, "expl": "An EPIRB is a distress beacon that triggers a full SAR response, so activate it only for grave and imminent danger, the same threshold as a MAYDAY.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "Every vessel that operates on the high seas, or beyond 3 miles from the coastline of the Great Lakes must carry a Category I 406 MHz EPIRB that _________________________.", "opts": ["is in good operating condition and is stowed near its charger", "will float free and clear of the sinking vessel and automatically activate", "is protected against all physical hazards", "All of the above"], "correct": 1, "expl": "Category I means float-free and automatically activated: a hydrostatic release lets it surface and start transmitting even if nobody can reach it.", "ref": "", "missed": true, "flag": false}, {"sec": "DGS", "topic": "Watchkeeping & Lookout", "tag": "", "q": "How should one scan the sky, sea, and horizon when looking for an object?", "opts": ["Only when prompted by another lookout", "Erratically without a pattern", "Slowly and regularly", "Quickly and sporadically"], "correct": 2, "expl": "Sweep slowly in overlapping sectors, pausing briefly on each, since the eye detects objects best when it stops.", "ref": "Scanning", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Watchkeeping & Lookout", "tag": "", "q": "How should the anchor watch ensure the boat's position is not drifting?", "opts": ["Take compass bearings on three separate objects", "Determine the distance to three points of land on radar", "Mark the boat's position with GPS", "All of the above"], "correct": 3, "expl": "Any combination of bearings, radar ranges, and a GPS anchor alarm will reveal drift; using several methods is best.", "ref": "Anchor Watch", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Watchkeeping & Lookout", "tag": "", "q": "When assigning duties to crewmembers onboard, which factor should the Captain consider?", "opts": ["The number of crewmembers on board", "Experience level and abilities", "Individual crewmembers' personal preferences", "Only Availability"], "correct": 1, "expl": "Match tasks to each person's skill and experience for safety and effectiveness.", "ref": "Lookout Watch", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Watchkeeping & Lookout", "tag": "", "q": "How often should the boat's position be confirmed during anchor watch?", "opts": ["Every 15 minutes", "Every 30 minutes", "As directed by the Captain", "Every 5 minutes"], "correct": 0, "expl": "The course standard is a position check every 15 minutes (more often if weather worsens).", "ref": "Anchor Watch", "missed": true, "flag": false}, {"sec": "DGS", "topic": "Watchkeeping & Lookout", "tag": "", "q": "What does a relative bearing of 180° indicate?", "opts": ["Straight out from the port beam", "Straight out from the starboard beam", "Dead astern", "Straight off the bow or dead ahead"], "correct": 2, "expl": "Relative bearings are measured clockwise from the bow: 000° ahead, 090° starboard beam, 180° astern, 270° port beam.", "ref": "Relative Bearings", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Watchkeeping & Lookout Duties", "tag": "", "q": "What is the acceptable range for maintaining a given course during the helm watch?", "opts": ["Within 5°", "Within 20°", "Within 15°", "Within 10°"], "correct": 0, "expl": "A good helmsman keeps the heading within about 5° of the ordered course; larger wander adds cross-track error and confuses other vessels about your intentions.", "ref": "Helm Watch", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Watchkeeping & Lookout Duties", "tag": "", "q": "What is the purpose of the anchor watch?", "opts": ["To ensure the anchor line is not chafing", "To prevent the anchor from dragging", "To look for other vessels in the area", "All of the above"], "correct": 3, "expl": "An anchor watch guards against every at-anchor hazard: chafe on the rode, a dragging anchor, and traffic that could come too close.", "ref": "Anchor Watch", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Watchkeeping & Lookout Duties", "tag": "", "q": "In fog conditions, why are binoculars not recommended?", "opts": ["They provide no additional visual benefit when visibility is already", "They are ineffective in humid air", "They are difficult to stabilize in heavy moisture", "They magnify background noise and echo distortion"], "correct": 0, "expl": "Binoculars magnify what you can see, but in fog there's nothing farther away to magnify; use your naked eyes and ears instead.", "ref": "reduced                                                                       Scanning", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Watchkeeping & Lookout Duties", "tag": "", "q": "Which two common scanning methods are mentioned in the material?", "opts": ["Left to center and right to center; Top to center and back again", "Left to right and back again; Top to bottom and bottom to top", "Top to down and bottom to up; Center to right and then center to left", "Left to right and right to left"], "correct": 1, "expl": "Sweep horizontally left-right-left and vertically top-bottom-top in small overlapping steps so no sector of the view is skipped.", "ref": "Scanning", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Watchkeeping & Lookout Duties", "tag": "", "q": "How can the anchor watch check if the anchor is dragging?", "opts": ["Check for tension on the anchor line", "Check the boat's position", "Feel for vibrations in the line", "All of the above"], "correct": 3, "expl": "A dragging anchor shows up as changing position (bearings/GPS), slack-then-snatch tension, and a rumbling vibration in the rode as the anchor bumps along the bottom.", "ref": "Anchor Watch", "missed": false, "flag": false}, {"sec": "DGS", "topic": null, "tag": "", "q": "How do lookouts make reports about the location of another object?", "opts": ["Using magnetic bearings", "Using true bearings", "Using relative bearings", "Using compass bearings"], "correct": 2, "expl": "", "ref": "Relative Bearings", "missed": false, "flag": false, "quiz": "Lesson 1 - Quiz"}, {"sec": "DGS", "topic": null, "tag": "", "q": "Regarding selecting lookout positions, what should be considered?", "opts": ["Convenient locations on the boat", "Scenic viewpoints", "Crewmember preferences", "Safety and the ability to effectively perform lookout duties under"], "correct": 3, "expl": "", "ref": "Lookout operating conditions                                                            Positioning", "missed": false, "flag": false, "quiz": "Lesson 1 - Quiz"}, {"sec": "DGS", "topic": null, "tag": "", "q": "How does going from a brightly lit room to a very dark room initially affect vision?", "opts": ["It has no impact on vision", "It improves vision immediately", "It decreases vision at first", "It has no effect on night vision"], "correct": 2, "expl": "", "ref": "Night Lookout Watch", "missed": false, "flag": false, "quiz": "Lesson 1 - Quiz"}, {"sec": "DGS", "topic": "Watchkeeping & Lookout Duties", "tag": "", "q": "Which of the following is NOT a guideline for the helm watch?", "opts": ["Execute maneuvers based on personal judgment when orders are", "Check with the Captain for any special instructions", "Repeat all commands given by the crew", "Maintain a given course within 10°"], "correct": 0, "expl": "Note: this item lists 'within 10°' as a valid guideline while the related item keys 'within 5°'; expect either on the exam. The key point stands: if an order is unclear, ask for clarification rather than improvising a maneuver.", "ref": "Helm unclear                                                                        Watch", "missed": false, "flag": true}, {"sec": "DGS", "topic": null, "tag": "", "q": "Why is reporting additional details beyond the object type important for the Captain?", "opts": ["To assist the Captain in decision-making", "To impress the Captain with detailed observations", "To show off the lookout's knowledge of marine objects", "To add complexity to the lookout's report"], "correct": 0, "expl": "", "ref": "Object Identification", "missed": false, "flag": false, "quiz": "Lesson 1 - Quiz"}, {"sec": "DGS", "topic": null, "tag": "", "q": "Why should the Captain select a stable location for the lookouts when positioning them?", "opts": ["To ensure a clear view of the surroundings", "To provide comfort for the crew", "To prevent the lookouts from being blown or swept overboard", "To make it easier for the crew to access facilities on the boat"], "correct": 2, "expl": "", "ref": "Lookout Positioning", "missed": false, "flag": false, "quiz": "Lesson 1 - Quiz"}, {"sec": "DGS", "topic": "Watchkeeping & Lookout Duties", "tag": "", "q": "What is suggested to prevent eye fatigue while scanning?", "opts": ["Looking away from the environment", "Staring directly at the horizon", "Periodically focusing on a close object", "Using binoculars"], "correct": 2, "expl": "Staring at a featureless horizon lets the eyes relax to a short focal length; glancing at a nearby object now and then resets focus and reduces strain.", "ref": "Scanning", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Watchkeeping & Lookout Duties", "tag": "", "q": "When using binoculars, what is the potential drawback?", "opts": ["Limited ability to detect objects in the dark", "Reduced field of vision", "Increased eyestrain", "Decreased distance vision capabilities"], "correct": 1, "expl": "Magnification narrows what you see, so use binoculars to examine a sighting, not to do the general search.", "ref": "Lookout Equipment", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Watchkeeping & Lookout Duties", "tag": "", "q": "What is the purpose of using binoculars during lookout duties?", "opts": ["To detect objects in the dark", "To reduce eyestrain and glare", "To increase the field of vision", "To increase distance vision capabilities"], "correct": 3, "expl": "Binoculars boost distance vision so a distant object can be identified, at the cost of field of view.", "ref": "Lookout Equipment", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Watchkeeping & Lookout Duties", "tag": "", "q": "What is the term for the gradual improvement of vision as the eyes adjust to weak light in darkness?", "opts": ["Dark adaptation", "Night vision enhancement", "Low light acclimation", "Bright adaptation"], "correct": 0, "expl": "Dark adaptation takes roughly 30 minutes for full effect, and one glance at bright white light can undo it.", "ref": "Night Lookout Watch", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "Which splice is used to connect two separate lines together?", "opts": ["Chain splice", "Back splice", "Eye splice", "Short splice"], "correct": 3, "expl": "A short splice unlaces both rope ends and interweaves the strands, permanently uniting two lines. Hook: SHORT splice joins two SHORT pieces.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "The \"square knot\" is used for...", "opts": ["Keeping line from fraying", "Joining two lines of equal size", "Joining two lines of different size", "Forming temporary eyes in lines"], "correct": 1, "expl": "The square knot holds well only between lines of equal size; with unequal sizes it can slip or capsize, which is the job of the sheet bend.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "A \"bowline\" is used to _________________.", "opts": ["join lines of equal size", "form a temporary eye (loop) at the end of a line", "be a stopper", "keep a line from fraying"], "correct": 1, "expl": "The bowline makes a fixed loop that won't slip or jam and unties easily even after loading -- the 'king of knots.'", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "You need to make a fixed loop at the end of a line in order to use the line as a mooring line. Which knot should you use?", "opts": ["Clove Hitch", "Bowline", "Fisherman's Bend", "Round-turn and two half hitches"], "correct": 1, "expl": "A bowline forms a fixed eye that holds under load yet unties easily, ideal for an improvised mooring eye.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "Which splice listed below would you use in order to make a permanent loop in a line?", "opts": ["Back splice", "Eye splice", "Long splice", "Short splice"], "correct": 1, "expl": "An eye splice tucks the strands back into the standing part to form a lasting eye. A back splice only finishes the end; long/short splices join two lines.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "Which weakens a line the LEAST?", "opts": ["Short splice", "Long splice", "Square knot", "Clove Hitch"], "correct": 0, "expl": "Splices retain far more strength than knots, which can cut breaking strength roughly in half. The exam bank keys the short splice as the least weakening.", "ref": "", "missed": true, "flag": false}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "Line is called \"small stuff\" when its circumference is less than __________________.", "opts": ["1\"", "1/2\"", "1.5\"", "3/4\""], "correct": 2, "expl": "Note: Many references (e.g., Chapman) put the small-stuff cutoff at 1-3/4 inch circumference; this bank keys 1.5 inch, so use that on the exam.", "ref": "", "missed": false, "flag": true}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "Chafing gear helps ________________.", "opts": ["prevent corrosion of running rigging", "reduce and prevents wear caused by the rubbing of one object against another", "protect the body against extreme cold", "reduce and prevents corrosion of standing rigging"], "correct": 1, "expl": "Chafing gear (hose, canvas, leather) is wrapped where lines rub chocks, edges or other lines, preventing abrasion damage.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "What is a whipping on a fiber line used for?", "opts": ["Keeps the line from unraveling", "Strengthens it", "Becomes part of a splice", "Protects your hands"], "correct": 0, "expl": "Whipping binds the rope's end with twine so the strands can't untwist or fray.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "Which knot prevents the end of a line from unreeving through blocks?", "opts": ["Sheepshank", "Overhand knot or figure eight", "Bowline", "Square knot"], "correct": 1, "expl": "Stopper knots such as the overhand or figure eight make a bulky end that can't run through a block or fairlead.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "Which of the following knots is used to attach two different sized lines together?", "opts": ["Thief knot", "Square knot", "Sheet bend", "Granny knot"], "correct": 2, "expl": "The sheet bend (becket bend) grips securely even when the two lines differ in size, unlike the square knot.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "You may place two mooring lines on the same bollard and either one cast off first if __________.", "opts": ["one of the lines is a breast line", "the bollard has two horns", "the eye of the second line is dipped", "the mooring lines are doubled"], "correct": 2, "expl": "'Dipping the eye' -- passing the second eye up through the first before dropping it over the bollard -- lets either line be lifted off independently.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "A \"sheepshank\" is used to ________________________.", "opts": ["stop off a line", "join lines of unequal size", "keep a line from fraying", "shorten a line"], "correct": 3, "expl": "A sheepshank takes up slack to shorten a line (or bypass a weak section) without cutting it.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "The most common method of securing a line to a cleat is a ____________.", "opts": ["figure eight, then round turns", "half hitch, then round turns", "figure eight, then half hitches", "round turn, then figure eights"], "correct": 3, "expl": "Take a full turn around the cleat base, then lay figure eights over the horns, finishing with a locking hitch if desired.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "Which bend or knot is used to tie a small line to a larger one?", "opts": ["Clove hitch", "Becket bend", "Lark's bend", "Bowline"], "correct": 1, "expl": "The becket bend (essentially a sheet bend) is designed to join lines of unequal size securely.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "A metal object on the pier resembling a tree stump and made to receive mooring lines is called a _________.", "opts": ["Camel", "Bight", "Chock", "Bollard"], "correct": 3, "expl": "A bollard is a heavy post on a pier or ship for securing mooring lines. A chock is a fairlead; a camel is a floating fender; a bight is a loop of line.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "Which statement is TRUE?", "opts": ["A back splice is used to permanently connect two lines together.", "In splicing fiber rope, you would splice with the lay of the line.", "A short splice is used to temporarily connect two lines.", "A short splice is never used in a line that must pass over a pulley or sheave."], "correct": 3, "expl": "A short splice increases the rope's diameter, so it can jam in a sheave; a long splice is used where the line must run through blocks.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "If a mooring line should part while you are tying up at a dock, you should make a temporary eye by tying a ____________________.", "opts": ["square knot", "Becket Bend", "clove hitch", "Bowline"], "correct": 3, "expl": "The bowline forms a dependable fixed loop quickly, making it the standard improvised eye.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "The strongest way to permanently join the two ends of a line is with a ________.", "opts": ["back splice", "short splice", "Carrick bend", "square knot"], "correct": 1, "expl": "A short splice keeps most of the rope's strength and is permanent; knots and bends weaken the line much more.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike & Deck Seamanship", "tag": "", "q": "Which of the following type of line will stretch the most when under strain?", "opts": ["Manila", "Dacron", "Nylon", "Polypropylene"], "correct": 2, "expl": "Nylon is highly elastic (can stretch roughly 15-25% or more), which makes it great for shock-absorbing anchor and dock lines.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "The dew point is reached when the ___________________.", "opts": ["air becomes saturated with water vapor", "relative humidity reaches 50%", "temperature of the air equals the temperature of the seawater", "atmospheric pressure is 14.7 lbs. per square inch"], "correct": 0, "expl": "The dew point is the temperature at which air becomes saturated (100% RH) and condensation -- fog or dew -- forms.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "A boundary between two air masses is a(n)...", "opts": ["Lapse rate", "Front", "Continent", "Isobar"], "correct": 1, "expl": "A front separates air masses of different temperature/humidity; isobars connect points of equal pressure.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "The Beaufort scale is used to estimate the ________________.", "opts": ["percentage of cloud cover", "wind direction", "wind speed", "barometric pressure"], "correct": 2, "expl": "The Beaufort scale (Force 0-12) estimates wind speed from observed sea state.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "The apparent wind can be zero when the true wind is from ___________________.", "opts": ["from astern and equal to the vessel's speed", "from ahead and equal to the vessel's speed", "from astern and is twice the vessel's speed", "zero"], "correct": 0, "expl": "Running downwind at exactly the wind's speed cancels it out, so the apparent wind is nil.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "A series of brief showers accompanied by strong, shifting winds may occur along or some distance ahead of a _____________.", "opts": ["Stationary front", "Warm front", "Occluded front", "Cold front"], "correct": 3, "expl": "Cold fronts bring squall lines and gusty, shifting winds, often ahead of the frontal boundary.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "A local wind that occurs during the daytime and is caused by the different rates of warming of land and water is called a _________________.", "opts": ["land breeze", "Chinook", "Foehn", "sea breeze"], "correct": 3, "expl": "Land heats faster by day, air rises over it, and cooler sea air flows onshore -- a sea breeze.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "When cold air displaces warm air, it is called a ____________________.", "opts": ["warm front", "stationary front", "cold front", "occluded front"], "correct": 2, "expl": "A cold front is the leading edge of advancing cold air replacing warmer air.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "A generally circular low pressure area is called a(n)...", "opts": ["Anticyclone", "Cyclone", "Occluded front", "Cold front"], "correct": 1, "expl": "A cyclone is a low; an anticyclone is a high.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "Which scale is used to estimate wind speed by observing sea conditions __________________.", "opts": ["Metric scale", "Beaufort wind scale", "Wind scale", "Coriolis scale"], "correct": 1, "expl": "The Beaufort scale links sea conditions (whitecaps, spray, wave height) to wind force.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "The term \"sea breeze\" is used when a wind _______________.", "opts": ["blows towards land during the day", "made up of cold air that descends on a coastal incline", "blows towards the sea at night", "is caused by the distant approach of a hurricane"], "correct": 0, "expl": "Sea breeze = sea-to-land by day; land breeze = land-to-sea at night.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "In the Northern Hemisphere a wind that shifts clockwise is a ____________________.", "opts": ["Backing wind", "Chinook wind", "Reverse wind", "Veering wind"], "correct": 3, "expl": "Veering = clockwise shift (e.g., S to W); backing = counterclockwise.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "What can present the greatest challenges to seamanship and survival skills?", "opts": ["Waves", "Seas", "Surf", "All of these"], "correct": 3, "expl": "Waves, seas and surf all challenge boat handling and survival; surf is especially dangerous near shore.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "A veering wind ______________________.", "opts": ["Circulate about a low-pressure center in a counterclockwise manner in the Northern Hemisphere", "Vary in strength constantly and unpredictably", "Circulate about a high-pressure center in a clockwise manner in the Southern Hemisphere", "Change direction in a clockwise manner in the Northern Hemisphere"], "correct": 3, "expl": "Veering means the wind direction changes clockwise; hook: Veer = clockwise, Back = counter.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "The type of cloud normally associated with thunderstorms is ________________________.", "opts": ["Cirrus", "Cumulus", "Cumulonimbus", "Stratus"], "correct": 2, "expl": "Cumulonimbus -- towering, anvil-topped clouds -- produce thunderstorms, lightning, hail and squalls.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "When a low-pressure weather system approaches, the weather generally ___________________.", "opts": ["improves", "remains the same", "is unpredictable", "worsens"], "correct": 3, "expl": "Lows bring rising air, clouds, precipitation and stronger winds; a falling barometer warns of worsening weather.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "A weather forecast states that the wind will commence backing. In the Northern Hemisphere, this wind would indicate that it will ________________.", "opts": ["continue blowing from the same direction", "shift in a clockwise manner", "shift in a counterclockwise manner", "decrease in velocity"], "correct": 2, "expl": "Backing = counterclockwise change in direction (e.g., W to S).", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "After a cold front passes through an area, the barometric pressure _______________.", "opts": ["fluctuates", "usually rises, often quite rapidly, with clearing skies", "remains the same", "remains the same, with clouds forming rapidly"], "correct": 1, "expl": "Behind a cold front cooler, denser air arrives, so pressure rises sharply and skies clear.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "When warm, moist air moves over colder land or water surfaces, what type of fog forms as a result?", "opts": ["Radiation fog", "Frost smoke", "Advection fog", "Ice fog"], "correct": 2, "expl": "Advection fog forms when moving moist air is chilled by a cold surface -- common at sea. Radiation fog forms over land on clear, calm nights.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "The common unit of measure for atmospheric pressure is ______________.", "opts": ["Centimeters", "Feet", "Degrees", "Inches"], "correct": 3, "expl": "In the U.S., pressure is usually read in inches of mercury (standard 29.92 inHg); millibars/hPa are also used.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Weather", "tag": "", "q": "The wind speed and direction observed from a moving vessel is defined as ________________.", "opts": ["an apparent wind", "an anemometer wind", "a true wind", "a coordinate wind"], "correct": 0, "expl": "Apparent wind combines the true wind with the wind created by the boat's own motion.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Radio Communications", "tag": "", "q": "Which distress call has the highest priority?", "opts": ["RED ALERT", "MAYDAY", "SECURITÉ", "PAN-PAN"], "correct": 1, "expl": "Priority order: MAYDAY (grave and imminent danger) > PAN-PAN (urgency) > SECURITE (safety).", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Radio Communications", "tag": "", "q": "The national distress, safety, and calling frequency is channel ___________________.", "opts": ["16", "13", "18", "22"], "correct": 0, "expl": "VHF Channel 16 (156.8 MHz) is for distress, safety and calling; Ch 13 is bridge-to-bridge and Ch 22A is the Coast Guard working channel.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Radio Communications", "tag": "", "q": "Which of the choices below is most likely to be affected by atmospheric disturbances?", "opts": ["INMARSAT", "VHF DSC", "Safety NET", "MF/HF radiotelephone"], "correct": 3, "expl": "MF/HF signals travel by bouncing off the ionosphere, so solar activity, static and storms degrade them far more than satellite or line-of-sight VHF. Hook: the longer the wave, the more the weather talks back.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Radio Communications", "tag": "", "q": "The VHF frequency designated to be used only to transmit or receive \"navigational information\" on the navigational waters of the United States is ___________.", "opts": ["156.6 MHz (channel 12)", "156.8MHz (channel 16)", "156.7 MHz (channel 14)", "156.65 MHz (channel 13)"], "correct": 3, "expl": "Channel 13 (156.65 MHz) is the bridge-to-bridge navigation-safety channel; 16 is distress/calling. Hook: 13 is for 'ships passing' talk
