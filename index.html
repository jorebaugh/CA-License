ect": 1, "expl": "The fire tetrahedron adds the self-sustaining chemical chain reaction. Dry chemical and Halon-type agents work by interrupting it.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "A fire in electrical equipment should be extinguished by using _________________.", "opts": ["salt water", "foam", "low-velocity fog", "CO2"], "correct": 3, "expl": "CO2 is non-conductive and leaves no residue, making it ideal for energized electrical (Class C) fires. Water and foam conduct electricity.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "All approved portable fire extinguishers must be capable of being ___________________.", "opts": ["recharged in the field", "used on class \"B\" fires", "carried by hand to a fire", "carried or rolled to a fire"], "correct": 2, "expl": "By definition a portable extinguisher is hand-carried; wheeled units are semi-portable.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "Fires of which class would most likely occur in the engine room of a vessel?", "opts": ["Classes A and D", "Classes C and D", "Classes B and C", "Classes A and B"], "correct": 2, "expl": "Engine rooms are full of fuel/lube oil (Class B) and energized electrical gear (Class C).", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "The most effective cooling agent used to fight fires is ________________.", "opts": ["Water fog or spray", "Mechanical foam", "Carbon dioxide", "Chemical foam"], "correct": 0, "expl": "Water absorbs huge amounts of heat, and breaking it into fine fog droplets maximizes surface area for heat absorption and steam conversion.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "Which of the statement below describes the primary process by which fires are extinguished by dry chemical?", "opts": ["The stream of dry chemical cools the fire.", "The dry chemical removes the fuel.", "The dry chemical smothers the fire.", "The dry chemical powder extinguishes the flames by breaking the combustion chain."], "correct": 3, "expl": "Dry chemical powder chemically breaks the chain reaction leg of the fire tetrahedron, knocking flames down very quickly.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "Extinguishers with a gross weight of more than 55 pounds when fully charged are considered ___________________________.", "opts": ["fixed", "compact", "semi-portable", "portable"], "correct": 2, "expl": "Over 55 lb is semi-portable (sizes III-V, often on wheels or with a hose reel); portable units (sizes I-II) can be carried by hand.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "When discharging a portable Carbon Dioxide (CO2) fire extinguisher, you should not hold the horn of the extinguisher because the horn ____________________________.", "opts": ["is placed directly in the flames", "becomes extremely hot", "becomes extremely cold", "could come off in your hands"], "correct": 2, "expl": "Expanding CO2 drops sharply in temperature and can frost the horn enough to cause frostbite-like injury; hold the insulated handle.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "Dry chemical extinguishers may be used on which classification of fires?", "opts": ["B or C Class fires", "C only", "B only", "A only"], "correct": 0, "expl": "Ordinary (sodium/potassium bicarbonate) dry chemical is a B-C agent; multipurpose ABC powder also exists but the classic answer is B and C.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "Fire extinguishers are numbered by size I through V, with I being __________________.", "opts": ["used for electrical fires only", "the smallest", "the most accessible", "the most effective"], "correct": 1, "expl": "Roman numerals rate capacity: I is the smallest, V the largest. Sizes I and II are hand portable.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "Which method of heat transmission does not require physical contact for fire to be spread between decks, bulkheads, or other surfaces?", "opts": ["Transfer Modulation", "Radiation", "Conduction", "Convection"], "correct": 1, "expl": "Radiation travels as heat rays through space, like sunlight; conduction needs contact and convection needs moving air or gas.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "Fixed CO2 systems would not be used on crew's quarters or __________________.", "opts": ["spaces open to the atmosphere", "the engine room", "cargo holds", "the paint locker"], "correct": 0, "expl": "CO2 works by building up an inert concentration in an enclosed space; in an open space it just blows away. It's also lethal, hence not used in quarters.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "Foam effectively extinguishes a fire mainly by __________________.", "opts": ["Chemical action", "Smothering", "Inerting the air", "Cooling"], "correct": 1, "expl": "Foam forms a blanket over the fuel surface that cuts off oxygen and seals in flammable vapors, with some secondary cooling.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "When fighting an oil or gasoline fire down in the bilge, which of the following should not be used?", "opts": ["High-velocity fog.", "Low-velocity fog.", "Foam.", "Solid stream of water."], "correct": 3, "expl": "A solid stream splashes and spreads burning fuel, which floats on the water, enlarging the fire.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "The most important characteristic of the extinguishing agent in fighting a class \"C\" fire is ______________________.", "opts": ["Cost", "Weight", "Electrical non-conductivity", "Temperature"], "correct": 2, "expl": "Class C fires involve energized equipment, so the agent must be electrically non-conductive (e.g. CO2, dry chemical) to protect the firefighter.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "During a Coast Guard inspection all carbon dioxide fire extinguishers aboard will be _________________.", "opts": ["weighed", "checked for pressure loss", "sent ashore to an approved service facility", "discharged and recharged"], "correct": 0, "expl": "CO2 units have no gauge, so inspection is by weight compared to the full weight stamped on the valve.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "Removing which element below will extinguish a fire?", "opts": ["Nitrogen", "Oxygen", "Sodium", "Carbon dioxide"], "correct": 1, "expl": "Oxygen is one leg of the fire triangle; removing it (smothering) extinguishes the fire.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "The straight stream setting of an all-purpose nozzle is used in fighting a class A fire to ________________.", "opts": ["break up burning material", "drive heat and smoke ahead of the fire fighters", "shield fire fighters from radiant heat", "get the most water possible on the fire"], "correct": 0, "expl": "A straight stream has reach and force to penetrate and break up burning solids so water reaches the seat of the fire; fog patterns are for shielding and cooling.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "All of the following are part of the fire triangle EXCEPT _____________.", "opts": ["heat", "oxygen", "electricity", "fuel"], "correct": 2, "expl": "The triangle is heat, fuel, and oxygen. Electricity can be an ignition source but is not a side of the triangle.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "Which condition can cause Spontaneous combustion?", "opts": ["An outside heat source heating a substance until it ignites", "The use of an unprotected drop-light bulb", "A chemical action within a substance", "Conduction of heat through a wall of material until it ignites"], "correct": 2, "expl": "Spontaneous combustion comes from internal oxidation (e.g. oily rags) generating heat until ignition temperature is reached, with no outside source.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "Shipboard Fire hose couplings _____________________.", "opts": ["are specially hardened to prevent crushing", "should be painted red in order to identify house lengths", "are made of bronze, brass, or soft alloy metals", "can easily be damaged by dropping"], "correct": 2, "expl": "Couplings are made of bronze, brass, or soft alloy to resist corrosion and avoid sparking.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "A class C fire would be burning _______________.", "opts": ["electrical insulation", "celluloid", "fuel oil", "wood"], "correct": 0, "expl": "Class C = energized electrical equipment. Hook: C for Current.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "A fire in the trash is made up of paper waste. What class fire is this?", "opts": ["B", "A", "C", "D"], "correct": 1, "expl": "Class A fires burn ordinary combustibles such as paper, wood, and cloth that leave Ash.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "Which fire extinguishing agent will absorb the most heat?", "opts": ["CO2", "Water", "Dry chemical", "Foam"], "correct": 1, "expl": "Water has a very high heat capacity and latent heat of vaporization, making it the best cooling agent.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "A fire hose with a nozzle attached must be connected to each hydrant except when exposed to heavy weather or when the __________________________.", "opts": ["fire-main system is not charged", "vessel is in port", "fire pumps are used for purposes other than supplying water to the fire main", "fire hose might be damaged by cargo operations"], "correct": 3, "expl": "Hoses stay connected for instant use; the only exceptions are heavy weather or when cargo work could damage them (then they're stowed nearby).", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "Ventilation systems connected to a compartment in which a fire is burning are closed to prevent the rapid spread of the fire by ___________________.", "opts": ["Conduction", "Convection", "Radiation", "Spontaneous combustion"], "correct": 1, "expl": "Convection moves hot gases and smoke through ducts to other spaces; closing vents cuts that path and the oxygen supply.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "Convection spreads a fire by _______________________.", "opts": ["burning liquids flowing into another space", "heated gases flowing through ventilation systems", "the transfer of heat across an unobstructed space", "transmitting the heat of a fire through the ship's metal"], "correct": 1, "expl": "Convection is heat carried by moving hot air and gases, e.g., up stairwells or through vent trunks. Through metal is conduction; across open space is radiation.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike Seamanship", "tag": "", "q": "In a man‐overboard rescue, which knot is ideal for creating a secure, non‐constricting loop around a person that holds under load yet can be untied easily afterward?", "opts": ["Square knot", "Clove hitch", "Figure‐eight knot", "Bowline"], "correct": 3, "expl": "The bowline makes a fixed loop that won't slip or squeeze the victim and unties easily even after heavy loading: the 'king of knots'.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "A Class B fire is most successfully fought by _________.", "opts": ["using the extinguishing agent to absorb the heat", "cooling the burning material below its ignition temperature", "preventing oxygen from reaching the burning material", "using the extinguishing agent to make the burning material fire-resistant"], "correct": 2, "expl": "Class B (flammable liquids) fires are best smothered with foam, CO2, or dry chemical; water spray can spread burning liquid.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike Seamanship", "tag": "", "q": "Nylon line can be dangerous because it ________________.", "opts": ["stretches", "is not elastic", "breaks down when wet", "kinks when wet"], "correct": 0, "expl": "Nylon stretches a lot under load and stores energy; if it parts, it snaps back violently. Stay out of the bight and the line of pull.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Pollution Prevention", "tag": "", "q": "A vessel fitted only with a sewage holding tank (no treatment system) may lawfully discharge untreated sewage when underway at not less than 4 knots and beyond how many nautical miles from the nearest land?", "opts": ["6 nautical miles", "24 nautical miles", "12 nautical miles", "3 nautical miles"], "correct": 2, "expl": "MARPOL Annex IV allows untreated holding-tank sewage to be discharged at a moderate rate beyond 12 nm while underway at 4+ knots. (U.S. domestic rules for Type III MSDs use 3 nm, so read the question's wording.)", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "The EPIRB on board your vessel is required to be tested ______________________.", "opts": ["quarterly", "yearly", "weekly", "monthly"], "correct": 3, "expl": "Commercial vessel rules call for a monthly EPIRB self-test (and battery/HRU expiration checks), using the unit's test function.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "When stowing an inflatable liferaft, it should be arranged so that it ________________.", "opts": ["floats free and inflates automatically if the vessel sinks", "is placed below deck to protect it from weather", "is lashed tightly with chains to prevent drift", "remains secured until manually released by cutting its painter"], "correct": 0, "expl": "Float-free stowage with a hydrostatic release ensures the raft deploys even if nobody can launch it before the vessel goes down.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike Seamanship", "tag": "", "q": "Which type of line floats?", "opts": ["Old manila", "Dacron", "Polypropylene", "Nylon"], "correct": 2, "expl": "Polypropylene is lighter than water, which makes it ideal for ring-buoy and rescue lines, though it degrades in sunlight.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "The fire tetrahedron model adds a fourth element to the traditional fire triangle. Which of the following is NOT one of the four elements required for combustion according to the fire tetrahedron?", "opts": ["Oxygen", "Fuel", "Heat", "Pressure"], "correct": 3, "expl": "The four sides are fuel, heat, oxygen, and the chemical chain reaction. Pressure isn't one of them.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "What should your FIRST action be if you discover a fire on your vessel?", "opts": ["Set a fire watch", "Attempt to put the fire out", "Sound the alarm", "Call the Captain"], "correct": 2, "expl": "Raising the alarm first gets everyone moving and gets help coming before you try to fight it.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "Which statement concerning satellite EPIRB's is TRUE?", "opts": ["The coded signal identifies the nature of the Distress situation.", "Once activated, these EPIRB's continuously send up a signal for use in identifying the vessel and for determining the position of the beacon.", "The coded signal only identifies the vessel's name and port of registry.", "If the GMDSS Radio Operator does not program the EPIRB, it will transmit default information such as the follow-on communications frequency and mode."], "correct": 1, "expl": "A 406 MHz EPIRB repeatedly transmits its unique registered ID, which links to vessel info, and satellites use it to locate the beacon.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "Which survival equipment found in life rafts helps reduce dehydration and sun exposure?", "opts": ["Desalination pump", "Fishing kit", "Radar reflector", "Canopy or cover"], "correct": 3, "expl": "Shade from the canopy reduces sweating and sunburn, directly conserving body water.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike Seamanship", "tag": "", "q": "Which statement concerning a short splice is TRUE?", "opts": ["A short splice is stronger than two lines joined by a knot.", "A short splice decreases the diameter of the line.", "It is used to temporarily join two lines together.", "A short splice is weaker than two lines joined by a knot."], "correct": 0, "expl": "A splice keeps roughly 85-95% of line strength while knots may cut it nearly in half. The tradeoff is that a short splice thickens the line.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike Seamanship", "tag": "", "q": "Chafing gear should be placed __________________________.", "opts": ["at all wearing points of mooring lines", "on wire rope only", "around running rigging", "at the bitter ends of all standing rigging"], "correct": 0, "expl": "Chafing gear protects mooring lines wherever they bear on chocks, rails, or pier edges and would otherwise wear through.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "A fire blanket extinguishes a small fire by removing which element of the fire tetrahedron?", "opts": ["Fuel", "Heat", "Chemical chain reaction", "Oxygen"], "correct": 3, "expl": "The blanket seals the fire off from air, so it starves for oxygen.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "Dry chemical fire extinguishers put out flames by:", "opts": ["Forming a barrier between fuel and air", "Disrupting the fire’s chemical reaction", "Removing moisture from the fire", "Cooling the burning material"], "correct": 1, "expl": "Dry chemical agents chiefly break the combustion chain reaction (the fourth side of the tetrahedron), with some smothering effect.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Engines & Fueling Safety", "tag": "", "q": "If a gasoline engine turns over freely but will not start, the cause is generally...", "opts": ["Low lube oil level", "Weak valve springs", "A defective ignition system", "Too heavy a load"], "correct": 2, "expl": "Free cranking rules out mechanical binding, so suspect spark (ignition) first.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "A fire in a pile of linen is a class _________________.", "opts": ["Class B", "Class A", "Class D", "Class C"], "correct": 1, "expl": "Class A covers ordinary combustibles that leave Ash: wood, paper, cloth. Hook: A = Ash.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "On inflatable liferafts, the operating cord should be renewed by ...", "opts": ["An approved servicing facility ashore.", "Cutting the old line off and renewing same.", "Opening the case and replacing the entire line.", "One of the ship's officers."], "correct": 0, "expl": "The raft container is sealed and must only be opened and serviced by an approved servicing station, never by the crew.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike Seamanship", "tag": "", "q": "Which knot is suitable for hoisting an unconscious person?", "opts": ["Clove hitch", "Two-half hitches", "Three half hitches", "Bowline"], "correct": 3, "expl": "A bowline's fixed loop won't tighten around the person's chest under load.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Boat Handling", "tag": "", "q": "When operating in a no-wake zone, the most appropriate action is to:", "opts": ["Operate at the minimum speed necessary to maintain steerage", "Shift to neutral and let the vessel drift", "Reduce speed while keeping the vessel on plane", "Maintain cruising RPM to avoid losing control"], "correct": 0, "expl": "Bare steerageway produces minimal wake while keeping control; staying on plane or drifting are both wrong.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Engines & Fueling Safety", "tag": "", "q": "Which statement is TRUE concerning gasoline vapors on board a vessel?", "opts": ["They should be vented into the engine to improve combustion.", "They are heavier than air and will settle in the lowest part of the vessel.", "They should be vented into the wheelhouse.", "They are lighter than air and will settle in the highest part of the vessel."], "correct": 1, "expl": "Gasoline vapor sinks into the bilge, so ventilate low spaces and run the blower before starting.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "Which action is routinely performed at the annual servicing and inspection of a dry-chemical cartridge-operated portable fire extinguisher?", "opts": ["Pressure test the discharge hose.", "Test the pressure gauge for correct reading.", "Replace the dry chemical.", "Weigh the cartridge."], "correct": 3, "expl": "Cartridge-operated units have no pressure gauge; the gas cartridge is weighed to confirm it hasn't leaked.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Pollution Prevention", "tag": "", "q": "When cleaning up an oil spill, skimmers deployed to remove oil from the water’s surface are an example of ______ recovery methods.", "opts": ["chemical", "mechanical", "thermal", "biological"], "correct": 1, "expl": "Skimmers and booms physically collect oil, which makes them mechanical recovery; dispersants are chemical and in-situ burning is thermal.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike Seamanship", "tag": "", "q": "A \"figure eight\" knot is used to _________________.", "opts": ["be a stopper", "shorten a line", "join lines of equal size", "secure a line to a ring in an anchor or mooring buoy"], "correct": 0, "expl": "A figure-eight in the end of a line keeps it from running out through a block or fairlead.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marlinespike Seamanship", "tag": "", "q": "The whipping found on a fiber line ________.", "opts": ["becomes part of a splice", "protects your hands", "strengthens it", "keeps the line from fraying"], "correct": 3, "expl": "Whipping is twine bound around the line's end so the strands can't unlay or fray.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Watchkeeping & Lookout Duties", "tag": "", "q": "When can a look-out leave their duty station?", "opts": ["When properly relieved.", "At the end of the watch.", "At any time.", "15 minutes before the end of the watch."], "correct": 0, "expl": "A lookout stays on station until a relief has taken over and been briefed. No gap in the watch is acceptable.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Radio Communications", "tag": "", "q": "The radiotelephone safety signal is ___________________________.", "opts": ["\"Safety\" repeated 3 times", "\"Securite\" repeated 3 times", "\"Pan Pan\" repeated 3 times", "\"Securite Securite\" repeated 3 times"], "correct": 1, "expl": "SECURITE x3 is for navigation or weather safety info; PAN-PAN x3 is urgency; MAYDAY x3 is distress.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "When you discover that an inflatable liferaft container is still sealed by its steel retention bands, you should:", "opts": ["mark the raft unserviceable and schedule it for disposal.", "remove the bands yourself and conduct an immediate inflation test.", "cut the bands and open the container to inspect the raft’s condition.", "leave the bands intact and report the finding to the qualified servicing authority."], "correct": 3, "expl": "Note: transit bands left on can stop the raft from floating free, so the problem needs prompt correction, not just a report. Per the bank answer, though, crew don't tamper with the sealed raft; refer it to an approved servicing facility.", "ref": "", "missed": false, "flag": true}, {"sec": "DGS", "topic": "Engines & Fueling Safety", "tag": "", "q": "The spontaneous ignition of fuel in a marine diesel engine relies chiefly on the engine’s high:", "opts": ["Glow‐plug temperature", "Spark‐timing precision", "Intake‐air humidity", "Compression ratio"], "correct": 3, "expl": "High compression (often 14:1 to 22:1) heats the intake air enough to ignite the injected fuel without a spark.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Lifesaving Equipment", "tag": "", "q": "To launch a liferaft by hand you should __________________.", "opts": ["cut the casing bands, throw the liferaft over the side, and it will then inflate", "cut the casing bands, throw t const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
CARDS.forEach((c,i)=>c.id=i);
let trouble = new Set(store.get("ror_trouble",[]));
const st = {mode:store.get("ror_mode","quiz"), sec:"all", src:"all", tag:"all", set:"all", queue:[], pos:0, revealed:false, picked:null, right:0, seen:0};
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LET="abcd";

function fillTopics(){
  const sel=$("#srcSel"); const cur=st.src;
  const topics=[...new Set(CARDS.filter(c=>st.sec==="all"||c.sec===st.sec).map(c=>(st.sec==="all"?c.sec+" · ":"")+c.topic))].sort();
  sel.innerHTML='<option value="all">All topics</option>'+topics.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("");
  st.src = topics.includes(cur)?cur:"all"; sel.value=st.src;
  $("#tagSeg").hidden = !(st.sec==="RR");
  if(st.sec!=="RR") st.tag="all";
}
const topicKey=c=>(st.sec==="all"?c.sec+" · ":"")+c.topic;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function lockedOrder(c){return c.opts.some(o=>/(all|none|both) of the above|^both [a-d]\b|^either/i.test(o))}

function build(){
  let pool = CARDS.filter(c=>(st.sec==="all"||c.sec===st.sec)&&(st.src==="all"||topicKey(c)===st.src)&&(st.tag==="all"||c.tag===st.tag));
  if(st.set==="trouble") pool = pool.filter(c=>trouble.has(c.id));
  if(st.set==="missed") pool = pool.filter(c=>c.missed);
  if(st.set==="flag") pool = pool.filter(c=>c.flag);
  st.queue = shuffle(pool.map(c=>{
    const idx=c.opts.map((_,i)=>i); if(!lockedOrder(c)) shuffle(idx);
    return {c, order:idx};
  }));
  st.pos=0; st.right=0; st.seen=0; resetCard(); render();
}
function resetCard(){st.revealed=false; st.picked=null}
function stats(){
  $("#sScore").textContent = st.mode==="quiz" ? `${st.right}/${st.seen}` : `${Math.min(st.pos+ (st.revealed?1:0),st.queue.length)}/${st.queue.length}`;
  $("#sTrouble").textContent = trouble.size;
}
function setTrouble(id,on){on?trouble.add(id):trouble.delete(id);store.set("ror_trouble",[...trouble])}

function render(){
  stats();
  const stage=$("#stage");
  if(!st.queue.length){
    stage.innerHTML = `<div class="card done"><div class="big">0</div><p>${st.set==="trouble"?"No trouble cards yet. Tap “Again” on any card you want to see more of, or miss one in quiz mode.":"No cards match these filters."}</p><button class="btn primary" type="button" id="toAll">Show every card</button></div>`;
    $("#toAll").onclick=()=>{st.set="all";st.sec="all";st.src="all";st.tag="all";fillTopics();syncControls();build()};
    return;
  }
  if(st.pos>=st.queue.length){
    const pct = st.seen?Math.round(100*st.right/st.seen):0;
    stage.innerHTML = `<div class="card done">
      ${st.mode==="quiz"?`<div class="big">${pct}%</div><p>${st.right} of ${st.seen} correct. The exam needs 90%.</p>`:`<div class="big">${st.queue.length}</div><p>cards reviewed.</p>`}
      <p class="hint">${trouble.size} card${trouble.size===1?"":"s"} in your trouble pile.</p>
      <div class="grp actions"><button class="btn primary" type="button" id="again">Shuffle &amp; go again</button>
      ${trouble.size?`<button class="btn" type="button" id="drillT">Drill trouble cards</button>`:""}</div></div>`;
    $("#again").onclick=build;
    const d=$("#drillT"); if(d) d.onclick=()=>{st.set="trouble";syncControls();build()};
    return;
  }
  const {c,order}=st.queue[st.pos];
  const isQuiz = st.mode==="quiz";
  const correctPos = order.indexOf(c.correct);
  const optsHtml = order.map((oi,k)=>{
    let cls="opt";
    if(isQuiz && st.picked!==null){ if(oi===c.correct) cls+=" right"; else if(k===st.picked) cls+=" wrong"; }
    if(!isQuiz && st.revealed && oi===c.correct) cls+=" right";
    return `<li><button type="button" class="${cls}" data-k="${k}" ${(!isQuiz||st.picked!==null)?"disabled":""}><span class="k">${LET[k]}</span><span>${esc(c.opts[oi])}</span></button></li>`;
  }).join("");
  const showAns = isQuiz ? st.picked!==null : st.revealed;
  let verdict="";
  if(isQuiz && st.picked!==null) verdict = st.picked===correctPos?`<div class="verdict ok">Correct</div>`:`<div class="verdict no">Not quite — answer is ${LET[correctPos]}</div>`;
  if(!isQuiz && st.revealed) verdict = `<div class="verdict neutral">Answer: ${LET[correctPos]}</div>`;
  const tagName = {Both:"Both Intl & Inland",Inland:"Inland only",Intl:"International only"}[c.tag];
  const secName = {RR:"Rules of the Road",DGS:"Deck General",NG:"Navigation General"}[c.sec];
  stage.innerHTML = `<article class="card">
    <div class="meta"><span class="chip sec">${secName}</span>${tagName?`<span class="chip ${c.tag}">${tagName}</span>`:""}<span class="topic">${esc(c.topic)}</span>
      ${c.missed?`<span class="chip miss">Missed on MLS</span>`:""}
      ${trouble.has(c.id)?`<span class="chip trouble">Trouble pile</span>`:""}
      <span class="count">${st.pos+1} / ${st.queue.length}</span></div>
    <p class="q">${esc(c.q)}</p>
    <ul class="opts">${optsHtml}</ul>
    ${showAns?`<div class="answer">${verdict}<div class="a">${esc(c.opts[c.correct])}</div>${c.expl?`<p class="ex">${esc(c.expl)}</p>`:""}${c.ref?`<div class="ref">Ref: ${esc(c.ref)}</div>`:""}</div>`:""}
    <div class="actions">
      ${showAns
        ? `<div class="grp"><button class="btn bad" type="button" id="bAgain">Again</button><button class="btn good" type="button" id="bGot">Got it</button></div><button class="btn primary" type="button" id="bNext">Next →</button>`
        : (isQuiz?`<span class="hint">Pick an answer</span>`:`<span></span><button class="btn primary" type="button" id="bFlip">Show answer</button>`)}
    </div></article>`;
  stage.querySelectorAll(".opt:not([disabled])").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  const f=$("#bFlip"); if(f) f.onclick=flip;
  const n=$("#bNext"); if(n) n.onclick=next;
  const a=$("#bAgain"); if(a) a.onclick=()=>{setTrouble(c.id,true);next()};
  const g=$("#bGot"); if(g) g.onclick=()=>{setTrouble(c.id,false);next()};
}
function pick(k){
  if(st.mode!=="quiz"||st.picked!==null||st.pos>=st.queue.length) return;
  const {c,order}=st.queue[st.pos];
  st.picked=k; st.seen++;
  if(order[k]===c.correct) st.right++; else setTrouble(c.id,true);
  render();
}
function flip(){ if(st.mode==="flash"&&!st.revealed){st.revealed=true;render()} }
function next(){ if(st.pos<st.queue.length){st.pos++;resetCard();render();window.scrollTo({top:0,behavior:"smooth"})} }

function seg(id,key){
  document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{st[key]=b.dataset.v; if(key==="mode") store.set("ror_mode",st.mode); syncControls(); build()});
}
function syncControls(){
  document.querySelectorAll("#modeSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===st.mode));
  document.querySelectorAll("#tagSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===st.tag));
  document.querySelectorAll("#secSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===st.sec));
  $("#srcSel").value=st.src; $("#setSel").value=st.set;
}
seg("modeSeg","mode"); seg("tagSeg","tag");
document.querySelectorAll("#secSeg button").forEach(b=>b.onclick=()=>{st.sec=b.dataset.v; fillTopics(); syncControls(); build()});
$("#srcSel").onchange=e=>{st.src=e.target.value;build()};
$("#setSel").onchange=e=>{st.set=e.target.value;build()};
$("#restart").onclick=build;
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT") return;
  if(/^[1-4]$/.test(e.key)) pick(+e.key-1);
  else if(e.key===" "){ e.preventDefault(); if(st.mode==="flash"&&!st.revealed) flip(); else next(); }
  else if(e.key==="ArrowRight"){ if(st.mode==="flash"&&!st.revealed) flip(); else if(st.mode==="flash"||st.picked!==null) next(); }
});
fillTopics(); syncControls(); build();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body></html>
