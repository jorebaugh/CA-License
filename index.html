.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Radio Communications", "tag": "", "q": "You have just called another vessel on the VHF and they have not replied. How long should you wait before calling that station again?", "opts": ["Seven minutes", "One Minute", "Five minutes", "Two minutes"], "correct": 3, "expl": "FCC practice is to wait at least two minutes between calls to the same station (and after three tries, wait 15 minutes) so the channel isn't tied up.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Radio Communications", "tag": "", "q": "A radiotelephone safety message urgently concerned with safety of a person would start with the word ______________________.", "opts": ["MAYDAY", "INTERCO", "SAFETY", "PAN-PAN"], "correct": 3, "expl": "PAN-PAN is the urgency signal: serious concern for a person or vessel, but not immediate grave danger (that's MAYDAY). SECURITE is for navigational safety.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Radio Communications", "tag": "", "q": "Which vessels must comply with the vessel bridge-to-bridge radiophone regulations while underway?", "opts": ["Passenger vessels of 100 gross tons or greater, carrying one or more passengers for hire while navigating.", "Towing vessels 25 feet in length or less.", "Sailing vessels 12 meters or less in length.", "Power-driven vessels 12 meters or less in length."], "correct": 0, "expl": "The Bridge-to-Bridge Act covers power vessels 20 m+, passenger vessels 100 GT+ carrying passengers for hire, towing vessels 26 ft+, and dredges/floating plant near channels.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Radio Communications", "tag": "", "q": "What is the minimum size power-driven vessel, that is not engaged in towing, required to comply with the vessel bridge-to-bridge radiotelephone regulations?", "opts": ["25 meters", "20 meters", "12 meters", "50 meters"], "correct": 1, "expl": "Power-driven vessels 20 meters (about 65 ft) and longer must monitor Ch 13 under the Bridge-to-Bridge Act. Towing vessels are covered at 26 ft and up.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Radio Communications", "tag": "", "q": "The height of a VHF radio antenna is more important than the power output of the radio because ________________________.", "opts": ["VHF communications are basically \"line of sight\"", "sea water absorbs the radiated energy", "salt water is a poor conductor of sound", "the boat is a poor conductor of sound"], "correct": 0, "expl": "VHF range is limited by the radio horizon; a taller antenna sees farther over the curve of the earth, whereas more power can't push past the horizon.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Radio Communications", "tag": "", "q": "What word is used as a distress call when transmitted by radiotelephone?", "opts": ["SECURITÉ", "BREAKER", "MAYDAY", "PAN-PAN"], "correct": 2, "expl": "MAYDAY (said three times) means grave and imminent danger requiring immediate help. Hierarchy: MAYDAY > PAN-PAN > SECURITE.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Radio Communications", "tag": "", "q": "A call is received from the U.S. Coast Guard addressed to all stations. The call begins with the words \"Pan-Pan\" (3 times). Which type of emergency signal would this be?", "opts": ["Red alert signal", "Distress signal", "Urgency signal", "Safety signal"], "correct": 2, "expl": "PAN-PAN is the urgency signal. Distress = MAYDAY, safety = SECURITE.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Radio Communications", "tag": "", "q": "A Coast Guard radiotelephone message about an aid to navigation that is off station is preceded by the word _______________________.", "opts": ["\"MAYDAY\"", "\"SECURITÉ\"", "\"PAN-PAN\"", "\"SOS\""], "correct": 1, "expl": "SECURITE (say-cure-ee-TAY) precedes navigational safety and weather messages, such as an aid to navigation off station.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Radio Communications", "tag": "", "q": "All VHF marine band radios operate in the simplex mode, which means that...", "opts": ["Only one person may talk at a time", "The radio only receives", "The radio only transmits", "Only two persons may talk at a time"], "correct": 0, "expl": "Simplex means transmit and receive share one frequency, so only one station talks at a time; say 'over' to hand off. A phone call is duplex.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Radio Communications", "tag": "", "q": "The reception of weak radio signals may be improved by \"opening up\" the squelch control. What is the normal setting of the squelch control?", "opts": ["Adjust the squelch control until the noise (static) can be heard, then adjust it slightly in the opposite direction until the noise stops", "Completely closed with the volume at the highest level", "Completely open with the volume at the lowest level", "None of the above"], "correct": 0, "expl": "Set squelch at the threshold: just past the point where background hiss disappears. That keeps the speaker quiet but still lets weak stations through.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Marine Radio Communications", "tag": "", "q": "If you wished to transmit a message by voice concerning the safety of navigation, you would preface it by the word...", "opts": ["Safety", "Mayday", "Securite", "Pan-pan"], "correct": 2, "expl": "SECURITE flags navigational and weather safety information, the lowest of the three priority signals.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Tides & Currents", "tag": "", "q": "When the moon and sun are in line with each other which type of tides occur?", "opts": ["Apogean", "Neap", "Spring", "Diurnal"], "correct": 2, "expl": "Aligned sun and moon (new/full moon) combine pull for spring tides: higher highs and lower lows.", "ref": "Tides", "missed": false, "flag": false}, {"sec": "NG", "topic": "Tides & Currents", "tag": "", "q": "Ebb current is _______________________.", "opts": ["the vertical motion towards land caused by a falling tide", "the horizontal motion away from land caused by a falling tide", "the vertical motion away from land caused by a falling tide", "the horizontal motion towards land caused by a falling tide"], "correct": 1, "expl": "Currents are horizontal; tides are vertical. Ebb flows seaward as the tide falls. Hook: Ebb = Exit.", "ref": "Tidal Currents", "missed": false, "flag": false}, {"sec": "NG", "topic": "Tides & Currents", "tag": "", "q": "The distance between the surface of the water and the tidal datum is the ________________.", "opts": ["height of the tide", "distance", "depth", "period"], "correct": 0, "expl": "Height of tide is measured from the chart datum (e.g., MLLW). Charted depth + height of tide = actual depth.", "ref": "Tides", "missed": false, "flag": false}, {"sec": "NG", "topic": "Tides & Currents", "tag": "", "q": "A tide is called diurnal when...", "opts": ["only one high and one low water occur each tidal day.", "the high tide and low tide are exactly six hours apart.", "the high tide is higher and the low tide is lower than usual.", "two high tides occur during a lunar day."], "correct": 0, "expl": "Diurnal = once daily. Semidiurnal tides have two highs and two lows per day.", "ref": "Tides", "missed": false, "flag": false}, {"sec": "NG", "topic": "Tides & Currents", "tag": "", "q": "Where would you find information about the time of high tide at a specific location on a particular day of the year?", "opts": ["Tide Tables", "Nautical Almanac", "Coast Pilot", "Tidal Current Tables"], "correct": 0, "expl": "Tide Tables predict times and heights of high and low water. Current Tables give flow speed/direction, not heights.", "ref": "Tide Tables", "missed": false, "flag": false}, {"sec": "NG", "topic": "Tides & Currents", "tag": "", "q": "The movement of water away from shore is called a(n) ______.", "opts": ["ebb current", "slack current", "flood current", "reversing current"], "correct": 0, "expl": "Ebb flows out to sea; flood flows in toward land.", "ref": "Tidal Currents", "missed": false, "flag": false}, {"sec": "NG", "topic": "Tides & Currents", "tag": "", "q": "The drift and set of tidal, river, and ocean currents refer to the __________________.", "opts": ["type and characteristic of the current flow", "position and area of current", "speed and direction toward which current flows", "maximum speed of the current"], "correct": 2, "expl": "Set = direction the water flows toward; drift = its speed in knots.", "ref": "Tide and Current Tables", "missed": false, "flag": false}, {"sec": "NG", "topic": "Tides & Currents", "tag": "", "q": "Tidal currents concur with _____________________.", "opts": ["the velocity of the tide", "the rise and fall of the tide", "actual water depth", "charted depth"], "correct": 1, "expl": "Horizontal tidal currents are produced by the vertical rise and fall of the tide.", "ref": "Tidal Currents", "missed": false, "flag": false}, {"sec": "NG", "topic": "Tides & Currents", "tag": "", "q": "Which term below refers to the direction toward which water is flowing?", "opts": ["Drift", "Set", "Vector direction", "Stand"], "correct": 1, "expl": "Set is the direction (toward which); drift is the speed. Hook: Set = Steering of the water.", "ref": "Tidal Currents", "missed": false, "flag": false}, {"sec": "NG", "topic": "Tides & Currents", "tag": "", "q": "What effect does current have on boat speed?", "opts": ["When going with the current the boat’s speed over ground (SOG) is slower than the speed/rpm indicator.", "Current speed and direction has not impact on the speed of the vessel.", "At first the boat will speed up and then slowly down.", "When going with the current the boat’s speed over ground (SOG) is faster than"], "correct": 3, "expl": "A following current adds to your speed through the water, so speed over ground is higher; a head current reduces it.", "ref": "the speed/rpm indicator.                                                            Tidal Currents", "missed": false, "flag": false}, {"sec": "NG", "topic": "Tides & Currents", "tag": "", "q": "A characteristic of a neap tide would be ________________.", "opts": ["high tides that are lower than normal and low tides that are higher than", "high and low tides are the same", "high tides that are lower than normal and low tides that are lower than normal", "high tides that are higher than normal and low tides that are lower than normal"], "correct": 0, "expl": "Neap tides (quarter moons, sun and moon at right angles) have the smallest range: lower highs and higher lows.", "ref": "normal                                                                            Tides", "missed": false, "flag": false}, {"sec": "NG", "topic": "Tides & Currents", "tag": "", "q": "The term \"flood current\" refers to that time period when the water ______________________.", "opts": ["is moving towards the ocean", "level is rising because of heavy rains", "level is not changing", "is flowing towards land"], "correct": 3, "expl": "Flood current flows landward as the tide rises. Hook: Flood floods in.", "ref": "Tidal Currents", "missed": false, "flag": false}, {"sec": "NG", "topic": "Tides & Currents", "tag": "", "q": "The datum used on any given chart provides the basis for _________________________.", "opts": ["horizontal movement of the water", "every sounding on the chart", "salinity content of the water", "mixing tendency of the water"], "correct": 1, "expl": "All charted soundings are measured from the datum (e.g., MLLW), so depths are referenced to that tidal level.", "ref": "Tides", "missed": false, "flag": false}, {"sec": "DGS", "topic": null, "tag": "", "q": "A common occurrence when a vessel is running into shallow water is that ______________.", "opts": ["the vessel will increase its speed", "the vessel is more responsive to the rudder", "\"Squat\" will cause a decrease in bottom clearance", "the wake is less pronounced"], "correct": 2, "expl": "", "ref": "", "missed": false, "flag": false, "quiz": "Lesson 4 - Quiz"}, {"sec": "DGS", "topic": "Boat Handling & Maneuvering", "tag": "", "q": "You are landing a single-screw vessel with a right-handed propeller port side to dock. As you approach the dock, you back down on your engine with rudder amidships. You would expect the vessel to __________________.", "opts": ["drift away from the dock", "swing its stern towards the dock", "swing its stern away form the dock", "lose headway without swinging"], "correct": 1, "expl": "A right-hand prop going astern walks the stern to port -- toward a dock on the port side -- which is why port-side landings are easier with a RH screw.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Boat Handling & Maneuvering", "tag": "", "q": "You are running a twin-screw vessel and lose your port engine. You continue to operate on your starboard engine only. Which action would you take to move your vessel ahead in a straight line?", "opts": ["Compensate with left rudder", "Rudder amidships - no compensation is necessary on a twin-screw vessel", "Surge the starboard engine", "Compensate with right rudder"], "correct": 3, "expl": "The offset starboard engine pushes the bow to port, so you counter with right rudder (steer toward the running engine's side).", "ref": "", "missed": true, "flag": false}, {"sec": "DGS", "topic": "Boat Handling & Maneuvering", "tag": "", "q": "The pivot point of a vessel with normal trim proceeding ahead at sea speed is ________________.", "opts": ["about two-thirds of the vessel's length from the bow", "about one-third of the vessel's length from the bow", "right at the bow", "near the stern"], "correct": 1, "expl": "Making headway shifts the pivot point forward to about one-third of the length from the bow; going astern moves it aft.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Boat Handling & Maneuvering", "tag": "", "q": "Your vessel is to dock bow first at a pier. Which line will be the most useful when maneuvering the boat alongside the pier?", "opts": ["The Inshore Head Line", "The Bow Breast Line", "The After-bow Spring", "The Stern Breast Line"], "correct": 2, "expl": "The after-bow spring (forward spring) lets you go ahead against it to pull the stern in and control fore-and-aft motion.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Boat Handling & Maneuvering", "tag": "", "q": "Your vessel is meeting another vessel in a narrow channel and will pass close aboard, bow cushion and stern suction occur between the vessels much the same as __________.", "opts": ["both vessels will gain speed", "when they are a great distance apart", "bank cushion and suction", "as two vessels drifting"], "correct": 2, "expl": "Close-passing ships interact like a ship near a bank: pressure builds between the bows (cushion) and low pressure aft draws the sterns together (suction).", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Boat Handling & Maneuvering", "tag": "", "q": "Your are docking a vessel, but are not yet alongside. Which line will be the most useful when maneuvering the vessel alongside the pier?", "opts": ["Inshore head line", "Bow breast line", "Stern breast line", "After-bow spring line"], "correct": 3, "expl": "Working against the after-bow spring with the engine ahead and rudder away from the pier swings the vessel in alongside.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Boat Handling & Maneuvering", "tag": "", "q": "Which shallow water effect will increase significantly if you increase your ship's speed?", "opts": ["Squatting", "Sinkage", "Bank cushion", "Smelling the bottom"], "correct": 0, "expl": "Squat rises roughly with the square of speed, so slowing down is the main way to reduce it.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Boat Handling & Maneuvering", "tag": "", "q": "When discussing the turning circle of a vessel, the term \"transfer\" means the distance_____________.", "opts": ["the ship moves sideways from the original course", "gained in the direction of the original course", "gained at right angles to the original course", "around the circumference of the turning circle"], "correct": 2, "expl": "Transfer is the distance gained at right angles to the original heading; advance is the distance along it.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Boat Handling & Maneuvering", "tag": "", "q": "The effect known as \"bank cushion\" acts in which of the following ways on a single-screw vessel proceeding along a narrow channel?", "opts": ["It forces the stern away from the bank", "It forces the bow away from the bank", "It heels the vessel toward the bank", "It forces the entire vessel away from the bank"], "correct": 1, "expl": "Water piles up between the bow and the near bank, shoving the bow away; meanwhile suction pulls the stern in.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Boat Handling & Maneuvering", "tag": "", "q": "The wedge of water building up between the bow and nearer bank, which forces the bow out and away, describes _________________.", "opts": ["bank suction", "bank cushion", "combined effect", "bend effect"], "correct": 1, "expl": "Bank cushion = the pressure wedge at the bow. Bank suction = the low pressure pulling the stern toward the bank.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Boat Handling & Maneuvering", "tag": "", "q": "You are operating a vessel that is dead in the water with the rudder amidships. As the right-handed screw starts to turn ahead, the bow will tend to go ________________.", "opts": ["as influenced by the tide and sea", "to port", "straight ahead", "to starboard"], "correct": 1, "expl": "Going ahead, a RH prop walks the stern to starboard, so the bow falls off to port.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": null, "tag": "", "q": "You are underway and proceeding ahead, as the speed increases, the pivot point tends to ________________.", "opts": ["move lower", "move aft", "remain stationary", "move forward"], "correct": 3, "expl": "", "ref": "", "missed": false, "flag": false, "quiz": "Lesson 4 - Quiz"}, {"sec": "DGS", "topic": "Boat Handling & Maneuvering", "tag": "", "q": "When underway and operating in shallow water which effect does speed through the water have on your vessel?", "opts": ["An increase in speed results in the vessel rising on an even plane", "A decrease in speed results in the vessel sucking down on an even plane", "A decrease in the speed results in a decrease in steering response and maneuverability", "An increase in speed results in the stern sucking down lower than the bow"], "correct": 3, "expl": "Speed increases squat; for typical single-screw vessels the stern draws down more than the bow, risking a grounding aft.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Boat Handling & Maneuvering", "tag": "", "q": "The distance gained in the direction of your vessels original course when you are making a turn is known as _________________.", "opts": ["advance", "tactical diameter", "drift", "transfer"], "correct": 0, "expl": "Advance is measured along the original heading; transfer is perpendicular to it.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Boat Handling & Maneuvering", "tag": "", "q": "You are docking a vessel. When possible, you should _________________.", "opts": ["approach the dock at a 90° angle and swing to", "go in against the current", "pass a mooring line to the dock with a heaving line and let the crew pull the vessel in", "go in with the current"], "correct": 1, "expl": "Stemming the current gives you steerage at low speed over the ground and lets you stop easily; a following current pushes you onto the dock.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Boat Handling & Maneuvering", "tag": "", "q": "The vessel that you are operating is broken down and rolling in heavy seas. You can reduce the danger of capsizing by_______________.", "opts": ["constantly shifting the rudder", "moving the passengers to the stern", "moving all passengers to one side of the boat", "heaving-to"], "correct": 3, "expl": "Note: With no propulsion you can't truly heave-to under power; in practice you'd hold the bow to the seas with a sea anchor/drogue. The bank keys heaving-to (keeping bow-to the seas).", "ref": "", "missed": false, "flag": true}, {"sec": "DGS", "topic": "Boat Handling & Maneuvering", "tag": "", "q": "You must heave-to while operating in a heavy weather. Under most circumstances, this is best done by _________________.", "opts": ["maintain speed and taking the sea broad on the bow", "stopping the engines and drifting beam to the sea", "going slow astern and taking the seas on the quarter", "taking the sea on the bow and reducing the speed to the minimum to hold that position"], "correct": 3, "expl": "Heaving-to under power means keeping the bow into (or slightly off) the seas with minimum steerageway, avoiding beam seas.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Boat Handling & Maneuvering", "tag": "", "q": "What effects will \"bank suction\" cause on a single-screw vessel proceeding along a narrow channel?", "opts": ["It pushes the entire vessel away from the bank", "It pulls the stern toward the bank", "It heels the vessel toward the bank", "It pulls the bow toward the bank"], "correct": 1, "expl": "Low pressure between the after body and the bank sucks the stern in, while bank cushion pushes the bow away -- together they sheer the ship off the bank.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Boat Handling & Maneuvering", "tag": "", "q": "Which of the following hull types typically produces the largest wake at hull speed?", "opts": ["Semi-displacement hull", "Catamaran hull", "Planing hull", "Displacement hull"], "correct": 3, "expl": "A displacement hull pushes water aside and can't climb its bow wave, generating a large wake as it nears hull speed.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": null, "tag": "", "q": "Seawater may be used for drinking _________________.", "opts": ["under no conditions", "at a maximum rate of two ounces per day", "if gathered during or immediately after a hard rain", "after mixing with an equal quantity of fresh water"], "correct": 0, "expl": "", "ref": "", "missed": false, "flag": false, "quiz": "Lesson 12 - Quiz"}, {"sec": "DGS", "topic": "Survival at Sea", "tag": "", "q": "Provided every effort is made to preserve body moisture content by avoiding perspiration, how long is it normally possible to survive without water?", "opts": ["Up to 3 days.", "8 to 14 days.", "25 to 30 days", "15 to 20 days."], "correct": 1, "expl": "With careful moisture conservation (shade, rest, no sweating), survival without water is typically about 8 to 14 days.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Survival at Sea", "tag": "", "q": "What is one of the FIRST actions you should take after abandoning and clearing away from a vessel?", "opts": ["Gather up useful floating objects.", "Identify the person in charge.", "Arrange watches and duties.", "Prepare for arrival of rescue units."], "correct": 1, "expl": "Survival depends on organization, so first establish who's in charge; that person then directs gathering gear, watches, and signaling.", "ref": "", "missed": true, "flag": false}, {"sec": "DGS", "topic": "Survival at Sea", "tag": "", "q": "You have abandoned ship. There are several rafts in the water. One of the first things to do is _______________.", "opts": ["Secure the rafts together to keep them from drifting apart", "transfer all the injured to one raft", "transfer all supplies to one raft", "separate the rafts as much as possible to increase chance of detection"], "correct": 0, "expl": "Linked rafts make a bigger target for searchers, let survivors share supplies and help, and keep the group together.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Survival at Sea", "tag": "", "q": "If supplies are limited, when should you first consume drinking water after boarding a lifeboat or life raft?", "opts": ["Some food and water should be consumed immediately and then not until 48 hours later.", "After 12 hours.", "Within 48 hours.", "After 24 hours."], "correct": 3, "expl": "For the first 24 hours the body still has reserves, so water given then is mostly lost as urine; start rationing after day one (except for the injured).", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Survival at Sea", "tag": "", "q": "If you must swim through an oil fire, you should NOT ...", "opts": ["enter the water feet first", "wear as much clothing as possible", "swim with the wind", "cover eyes with one hand when entering the water"], "correct": 2, "expl": "Swim into or across the wind so the flames are blown away from you; swimming downwind keeps you under the fire.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": null, "tag": "", "q": "The most important reason for taking anti-seasickness pills as soon as possible after entering a life raft is to ____________________.", "opts": ["assist in sleeping", "prevent loss of body moisture and vomiting", "reduce appetite by decreasing nausia", "prevent impaired judgement due to motion-induced deliriousness"], "correct": 1, "expl": "", "ref": "", "missed": false, "flag": false, "quiz": "Lesson 12 - Quiz"}, {"sec": "DGS", "topic": "Survival at Sea", "tag": "", "q": "Which statement concerning the collection of fresh water is false?", "opts": ["Liferaft covers and canopies should be washed with rain before drinking water is collected.", "Fresh water may be collected from condensation inside the liferaft.", "Seawater should never be consumed.", "Fresh water may be contained in some fish."], "correct": 3, "expl": "Note: survival manuals do list fish fluids (eyes, spinal fluid) as an emergency water source, so this key is debatable, but the exam bank marks the fish statement as false. The other three are standard good practice.", "ref": "", "missed": true, "flag": true}, {"sec": "DGS", "topic": "Survival at Sea", "tag": "", "q": "In a liferaft the greatest problem you face when submerged in cold water is _____________________.", "opts": ["collapse of the raft due to cold temperatures", "death due to hypothermia", "starvation", "asphyxiation due to keeping the canopy closed"], "correct": 1, "expl": "Cold water pulls heat from the body about 25 times faster than air, so hypothermia kills long before hunger or thirst.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Survival at Sea", "tag": "", "q": "You are at sea in an inflatable liferaft. In high latitudes, the greatest danger is _______________.", "opts": ["collapse of the raft due to cold temperatures", "asphyxiation due to keeping the canopy closed", "starvation", "hypothermia caused by cold temperature"], "correct": 3, "expl": "In cold regions, conserving body heat (stay dry, insulate the floor, huddle) is the top priority because hypothermia is the main killer.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Magnetic Compass", "tag": "", "q": "If the magnetic compass on your vessel will not be used for a long period of time it should __________________________.", "opts": ["be shielded from direct sunlight", "have any air bubbles replaced with nitrogen", "have compensating magnets removed", "be locked in a constant heading"], "correct": 0, "expl": "Sunlight's UV and heat degrade the compass fluid and card and can cause bubbles; cover it. Never remove correctors, which would undo the compensation.", "ref": "Compass", "missed": true, "flag": false}, {"sec": "NG", "topic": "Magnetic Compass", "tag": "", "q": "Deviation is not constant; it is different with every change in _____________________.", "opts": ["cargo", "geographic location", "speed", "vessel heading"], "correct": 3, "expl": "Deviation comes from the boat's own magnetic fields, whose effect on the compass changes as the boat swings to different headings, hence the deviation card by heading. Variation changes with location.", "ref": "Magnetic Deviation", "missed": false, "flag": false}, {"sec": "NG", "topic": "Magnetic Compass", "tag": "", "q": "If the compass heading and the magnetic heading are the same, then __________________.", "opts": ["there is something wrong with the compass", "the compass is being influenced by nearby metals", "the deviation has been offset by the variation", "There is no deviation on that heading"], "correct": 3, "expl": "Compass + deviation = magnetic. If they match, deviation on that heading is zero.", "ref": "Correcting for Compass Error", "missed": false, "flag": false}, {"sec": "NG", "topic": "Magnetic Compass", "tag": "", "q": "The lubber's line indicates__________.", "opts": ["compass north", "a relative bearing taken with an azimuth circle", "magnetic north", "the direction in which the boat's bow is heading."], "correct": 3, "expl": "The lubber's line is a fixed mark aligned with the keel; the compass card reading under it is the vessel's heading.", "ref": "Compass", "missed": true, "flag": false}, {"sec": "NG", "topic": "Magnetic Compass", "tag": "", "q": "Compass error is equal to the ___________________.", "opts": ["difference between true and magnetic compass", "total effect of variation and deviation taken", "deviation minus variation", "variation plus compass course"], "correct": 1, "expl": "Compass error = variation + deviation (combined algebraically); it's the full correction from compass to true. Hook: CE = V + D.", "ref": "Correcting for Compass together                                                    Error", "missed": false, "flag": false}, {"sec": "NG", "topic": "Magnetic Compass", "tag": "", "q": "A magnetic compass card is marked in how many degrees?", "opts": ["90", "180", "360", "400"], "correct": 2, "expl": "A full circle is 360°, and the compass card is graduated 000° through 359° clockwise from north.", "ref": "Compass", "missed": false, "flag": false}, {"sec": "NG", "topic": "Magnetic Compass", "tag": "", "q": "The magnetic compass operates on the principle that __________________.", "opts": ["unlike magnetic poles repel", "unlike poles attract", "the poles of the compass line up with the geographic poles of the earth", "like magnetic poles attract"], "correct": 1, "expl": "Opposite poles attract: the card's magnets are drawn toward the earth's magnetic poles (not the geographic ones), so the card points to magnetic north.", "ref": "Compass", "missed": false, "flag": false}, {"sec": "NG", "topic": "Magnetic Compass", "tag": "", "q": "As a vessel changes course to starboard, the compass card in a magnetic compass ____________.", "opts": ["remains aligned with compass north", "turns counterclockwise to port", "first turns to starboard then counterclockwise to port", "also turns to starboard"], "correct": 0, "expl": "The card stays fixed on north while the boat (and lubber's line) rotates around it, so it only appears to turn the opposite way.", "ref": "Compass", "missed": true, "flag": false}, {"sec": "NG", "topic": "Magnetic Compass", "tag": "", "q": "Which of the following is a primary advantage of having a magnetic compass onboard your vessel?", "opts": ["Compass error is neglible at or near the earth's poles", "It does not need to be checked often", "It is reliable due to its simplicity", "All points on the compass rose are readily visible"], "correct": 2, "expl": "A magnetic compass needs no power or electronics, so it's a dependable backup when GPS or electrical systems fail. (Its error actually grows near the poles.)", "ref": "Compass", "missed": false, "flag": false}, {"sec": "NG", "topic": null, "tag": "", "q": "A vessel heading NE is on a course of ___________________.", "opts": ["67.5 degrees", "90 degrees", "45 degrees", "22.5 degrees"], "correct": 2, "expl": "", "ref": "Direction", "missed": false, "flag": false, "quiz": "Lesson 2 - Quiz"}, {"sec": "NG", "topic": "Magnetic Compass", "tag": "", "q": "Deviation is caused by ____________________.", "opts": ["the magnetic lines of force not coinciding with the lines of longitude", "magnetic influence inherent to that particular vessel", "nearby magnetic land masses or mineral deposits", "changes in the earth's magnetic field"], "correct": 1, "expl": "Deviation comes from the boat's own magnetic influences (engine, steel, electronics, wiring) and varies with heading. Variation is the earth's part. Hook: Deviation = Due to the vessel.", "ref": "Magnetic Deviation", "missed": false, "flag": false}, {"sec": "NG", "topic": "Magnetic Compass", "tag": "", "q": "Which would influence a magnetic compass?", "opts": ["Iron Pipe", "Radio", "Electrical wiring", "All of these would have an influence on a magnetic compass"], "correct": 3, "expl": "Ferrous metal, electronics with speakers/magnets, and current-carrying wires all create magnetic fields that cause deviation.", "ref": "Magnetic Deviation", "missed": false, "flag": false}, {"sec": "NG", "topic": "Magnetic Compass", "tag": "", "q": "Brass is used for compass gimbals and binnacles because it ___________.", "opts": ["cannot be magnetized", "shines easily", "does not dissolve in or react with salt water", "does not oxidize, corrode, or rust"], "correct": 0, "expl": "Brass is non-ferrous and non-magnetic, so it won't add deviation to the compass.", "ref": "Parts of a Compass", "missed": false, "flag": false}, {"sec": "NG", "topic": "Magnetic Compass", "tag": "", "q": "A True heading differs from a Magnetic heading by _______________________.", "opts": ["variation", "compass error", "deviation", "northerly error"], "correct": 0, "expl": "Variation is the angle between true and magnetic north at your location. Hook: TVMDC - True, Variation, Magnetic, Deviation, Compass.", "ref": "Correcting for Compass Error", "missed": false, "flag": false}, {"sec": "NG", "topic": "Magnetic Compass", "tag": "", "q": "While applying a correction from true to magnetic heading on a Mercator chart, you note that variation is not constant; it changes with every alteration in your vessel’s __________.", "opts": ["geographic location", "heading", "chart scale", "speed"], "correct": 0, "expl": "Variation depends on where you are on the earth (read it from the nearest compass rose), not on heading. Deviation is what changes with heading.", "ref": "Magnetic Declination (Variation)", "missed": false, "flag": false}, {"sec": "NG", "topic": "Tides & Currents", "tag": "", "q": "As you plan your transit through the inlet on an incoming tide, you note that during the flood current period, the water __________.", "opts": ["flows toward the shore and rises toward high tide", "remains nearly motionless between tidal changes", "circulates parallel to the shoreline within the breakers", "flows away from the shore and falls toward low tide"], "correct": 0, "expl": "Flood current = flow toward land while the tide rises.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Tides & Currents", "tag": "", "q": "Your vessel is aground in soft mud. You would have the best chance of refloating it on the next tide if it grounded at _____________________.", "opts": ["low water spring", "high water spring", "low water neap", "high water neap"], "correct": 0, "expl": "If you ground at the lowest point of the strongest-range tide, the following high water will be well above your grounding level.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Tides & Currents", "tag": "", "q": "The datum used for soundings on charts covering the East Coast of the United States is _____________________________.", "opts": ["half tide level", "mean low water", "mean lower low water", "mean low water springs"], "correct": 2, "expl": "All NOAA charts of U.S. coasts now use Mean Lower Low Water (MLLW), the average of the lower of each day's two low tides.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "Preferred channel buoys indicate the preferred channel to transit by ____________________.", "opts": ["odd or even numbers", "the location of the buoy in the channel junction.", "the buoys light rhythms", "the color of their top band"], "correct": 3, "expl": "The top band color tells you which lateral mark it acts as for the preferred channel: green top = treat as port-side mark, red top = treat as starboard-side mark.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Magnetic Compass", "tag": "", "q": "While steering by compass on a clear night watch, you set your vessel’s heading to the point “Southwest.” This corresponds to a course of __________.", "opts": ["315°", "225°", "295°", "180°"], "correct": 1, "expl": "SW is halfway between S (180°) and W (270°): 225°.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Charts & Position", "tag": "", "q": "On a Mercator chart, 1 nautical mile is equal to...", "opts": ["1 degree of longitude", "1 minute of latitude", "1 minute longitude", "1 degree of latitude"], "correct": 1, "expl": "Measure distance on the latitude scale at the side of the chart: 1' latitude = 1 nm. Longitude minutes shrink toward the poles.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "What color light would a nun buoy display at night?", "opts": ["Blue", "Red", "Yellow", "Green"], "correct": 1, "expl": "Nuns are red starboard-side marks, so if lighted they show red.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "A light that has a light period shorter than its dark period is described as _______________.", "opts": ["flashing", "pulsating", "alternating", "occulting"], "correct": 0, "expl": "Flashing = light shorter than dark. Occulting is the reverse: light on longer than it's off.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Electronic Navigation", "tag": "", "q": "Heading is the ___________________.", "opts": ["Course over Ground (COG)", "direction in which a vessel is pointing at any given moment", "the direction which you wish to travel", "the vessel's track"], "correct": 1, "expl": "Heading = where the bow is pointed right now, which can differ from COG because of current and wind.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "The red sectors of navigational lights warn mariners of _________________________.", "opts": ["floating debris", "recently sunken vessels", "heavily trafficked areas", "shoals or nearby land"], "correct": 3, "expl": "Red sectors cover arcs where you'd be standing into danger such as shoals, rocks, or land.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "The time required for a lighted aid to complete a full cycle of light changes is listed in the Light List as _______________.", "opts": ["frequency", "period", "function", "set"], "correct": 1, "expl": "Period = duration of one full cycle of the light's pattern, in seconds.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Tides & Currents", "tag": "", "q": "The difference between the heights of low and high tide is the _______________________.", "opts": ["period", "depth", "tidal range", "distance"], "correct": 2, "expl": "Range of tide = high water height minus low water height.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "The light rhythm of Morse (A) is shown on what type of buoy(s)?", "opts": ["Preferred-channel buoys", "Safe water buoys", "Starboard or port-side buoys", "Special marks"], "correct": 1, "expl": "Safe water marks use a white Mo(A) light (short-long).", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Magnetic Compass", "tag": "", "q": "Compass error is the total effect of _________.", "opts": ["the bearing of an object", "variation", "variation and deviation taken together", "deviation"], "correct": 2, "expl": "Compass error = variation + deviation (applied with their E/W signs).", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "The four standard light colors used for aids to navigation that are lighted are red, green, white, and __________________________.", "opts": ["orange", "blue", "yellow", "purple"], "correct": 2, "expl": "Yellow lights are used on special marks (and some IALA marks). Blue isn't a standard aid light color.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "What are the defined characteristics of an isophase light?", "opts": ["2 sec. Flash, 5 sec eclipse", "1 sec. Flash, 1 sec. Eclipse", "4 sec. Flash, 2 sec. Eclipse, 3 sec. Flash, 2 sec. eclipse", "6 sec. Flash, 3 sec. Eclipse"], "correct": 1, "expl": "Isophase lights have equal light and dark intervals.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "While transiting a channel marked by lateral buoys under the U.S. system, you note red nun buoys on your starboard side. Under this scheme, which buoy type may bear an odd numeric designation?", "opts": ["A black spherical buoy", "A green can buoy", "A yellow safe-water buoy", "A red nun buoy"], "correct": 1, "expl": "Green cans are port-side marks and carry odd numbers; red nuns are even.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Tides & Currents", "tag": "", "q": "Which of the following terms refers to the direction a current is flowing?", "opts": ["Vector direction", "Stand", "Set", "Drift"], "correct": 2, "expl": "Set is direction (toward which); drift is speed.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Tides & Currents", "tag": "", "q": "How many high water tides usually occur each day on the East Coast of the United States?", "opts": ["One", "Three", "Four", "Two"], "correct": 3, "expl": "The East Coast has semidiurnal tides: two highs and two lows each tidal day (about 24 h 50 m).", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "The period of a lighted aid to navigation refers to the ________________.", "opts": ["time required for the longest flash of each cycle", "time required for the light to complete each cycle", "length of time between flashes of the light", "date of construction or establishment"], "correct": 1, "expl": "Period = time for one complete cycle of the light's characteristic.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Charts & Position", "tag": "", "q": "A bearing or series of bearings can be observed as _________.", "opts": ["Magnetic Declination (MD)", "variation", "deviation and variation", "compass, magnetic or true"], "correct": 3, "expl": "A bearing can be referenced to compass, magnetic, or true north; convert between them using deviation and variation.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Charts & Position", "tag": "", "q": "When consulting the compass rose on a nautical chart, the outer ring provides __________.", "opts": ["magnetic bearings measured clockwise from magnetic north", "true bearings measured clockwise from true north", "compass deviation values for the vessel", "the angular difference between true and magnetic north"], "correct": 1, "expl": "Outer ring = true; inner ring = magnetic. Hook: True is on the outside.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Charts & Position", "tag": "", "q": "What information does the outer ring of a compass rose on a nautical chart provide?", "opts": ["True directions", "Magnetic directions", "Variation", "Annual rate of variation change"], "correct": 0, "expl": "The outer ring is oriented to true north. Variation and its annual change are printed in the center.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "Authorized private aids to navigation used in or along navigable waters of the United States may be listed in the ________________________.", "opts": ["Sailing Directions", "Aids to Navigation Manual", "List of Private Aids", "Light List"], "correct": 3, "expl": "The USCG Light List includes federal aids and authorized private aids.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "In the U.S Aids to Navigation system a nun buoy will ________________", "opts": ["have an even number", "be green in color", "be left to port when entering from seaward", "be cylindrical in shape"], "correct": 0, "expl": "Nuns are red, cone-topped, even-numbered starboard-side marks.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "Using the U.S. Aids to Navigation System, red and green horizontally banded buoys mark __________.", "opts": ["channels for shallow draft vessels", "general anchorage areas", "fishing grounds", "junctions or bifurcation"], "correct": 3, "expl": "These are preferred-channel marks at channel junctions/splits; the top band shows the preferred side.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Magnetic Compass", "tag": "", "q": "The lubber's line on a magnetic compass indicates __________.", "opts": ["the direction in which the boat's bow is heading.", "compass north", "a relative bearing taken with an azimuth circle", "magnetic north"], "correct": 0, "expl": "The lubber's line is fixed in line with the keel, so the card reading against it is the vessel's compass heading.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Magnetic Compass", "tag": "", "q": "When taking a reading using a hand-bearing compass deviation is always considered to be _____________________", "opts": ["180º", "0º", "270º", "90º"], "correct": 1, "expl": "A hand-bearing compass is used away from the boat's magnetic influences, so deviation is taken as zero; apply variation only.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "Some lights used as aids to marine navigation have a red sector to indicate a danger area. The limits of a colored sector of a light listed in the light list in which of the following manners?", "opts": ["An outline of the area of the sector", "Geographic positions outlining the area of the sector", "True bearings as observed from the light towards the ship", "True bearings as observed from the ship toward the light"], "correct": 3, "expl": "Sector limits are given as true bearings as seen from seaward, from the ship toward the light, so you can compare directly with your own bearing to the light.", "ref": "Major Lights", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "A triangular daymark would be marked with the following color(s) ______________________.", "opts": ["red", "green and white", "red and white", "green"], "correct": 0, "expl": "Triangular daymarks are red starboard-side (even-numbered) marks. Hook: Red Right Returning, red triangles.", "ref": "Summary of Lateral Significance of Buoys and Beacons", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "A mooring buoy, if lighted, shows which color light?", "opts": ["Blue", "Yellow", "White", "Any color except red or green"], "correct": 2, "expl": "Mooring buoys are white with a blue band and, when lighted, normally show a white light.", "ref": "Private Aids to Navigation", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "Under the IALA-B Buoyage System, a conical buoy is _________________.", "opts": ["numbered with an odd number", "red in color", "left to port when entering from seaward", "identified by a letter"], "correct": 1, "expl": "In IALA-B (the Americas), conical (nun) buoys are red, even-numbered, and kept to starboard when returning from sea.", "ref": "Buoys", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "Which buoy listed below may be odd numbered?", "opts": ["A spherical buoy", "A yellow buoy", "A red buoy", "Unlighted can buoy"], "correct": 3, "expl": "Can buoys are green port-side marks and carry odd numbers. Red marks are even; spherical and yellow buoys are not numbered in the lateral sequence.", "ref": "Aids to Navigation (AtoN)", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "Buoys may be marked with reflective material to assist in their detection by search light. Which statement is true?", "opts": ["All reflective material is white because it is the most visible at night.", "A special-purpose mark will display either red or green reflective material to agree with its shape.", "A preferred-channel buoy displays either red or green reflective", "A safe-water buoy will display red and white vertical stripes of reflective material."], "correct": 2, "expl": "Preferred-channel buoys carry reflective material matching the color of the top band. Special marks use yellow and safe-water marks use red reflectors.", "ref": "Summary of material to agree with the top band of color.                               Lateral Significance of Buoys and Beacons", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "Which buoy from the list below may be even numbered?", "opts": ["Lighted green buoy", "Mid-channel buoy", "Special Purpose buoy", "Unlighted nun buoy"], "correct": 3, "expl": "Nun buoys are red starboard-side marks and carry even numbers. Hook: Red, Right, Returning, Even.", "ref": "Aids to Navigation (AtoN)", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "You are steering on a pair of range lights and find the upper light is above the lower light you should _______________.", "opts": ["come left", "come right", "wait until the lights are no longer in a vertical line", "continue on present course"], "correct": 3, "expl": "When the two range lights are vertically in line you are on the range centerline, so stay on course. If the top light drifts to one side, steer toward it.", "ref": "Range Lights", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "The time required for a lighted aid to complete a full cycle of light changes is called its...", "opts": ["Period", "Function", "Frequency", "Set"], "correct": 0, "expl": "The period is the time for one complete cycle of flashes and eclipses (e.g., 'Fl 4s' has a 4-second period).", "ref": "AtoN Signals and Characteristics", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "What are the characteristics associated with an isophase light?", "opts": ["4 sec. Flash, 2 sec. Eclipse, 3 sec. Flash, 2 sec. eclipse", "2 sec. Flash, 5 sec eclipse", "1 sec. Flash, 1 sec. Eclipse", "6 sec. Flash, 3 sec. Eclipse"], "correct": 2, "expl": "Isophase (Iso) means equal durations of light and dark in each period. Hook: 'iso' = equal.", "ref": "AtoN Signals and Characteristics", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "In the U.S. Aids to Navigation System, red and green horizontally banded buoys are used to mark ________________________.", "opts": ["junctions or bifurcation", "channels for shallow draft vessels", "general anchorage areas", "fishing grounds"], "correct": 0, "expl": "Horizontally banded red/green buoys are preferred-channel marks placed where a channel splits or joins; the top band color shows the preferred route.", "ref": "Summary of Lateral Significance of Buoys and Beacons", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "When entering from seaward, a starboard side daymark will ________________________.", "opts": ["be square in shape", "show a Morse (A) white light", "show a fixed red light if lighted", "have an even number if"], "correct": 3, "expl": "Starboard-side daymarks are red triangles with even numbers. (Squares are green, port side; lights on lateral aids flash rather than burn fixed.)", "ref": "Summary of Lateral Significance of Buoys and numbered                                 Beacons", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "The light rhythm of Morse (A) is found on ____________________.", "opts": ["special marks", "starboard or port-side buoys", "safe water buoys", "preferred-channel buoys"], "correct": 2, "expl": "Safe water (fairway/mid-channel) marks show white Mo(A), a short-long flash. Hook: 'A' for 'All clear around'.", "ref": "Summary of Lateral Significance of Buoys and Beacons", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "On a chart, the characteristic of the light on a lighthouse is shown as flashing white with a red sector. The red sector __________.", "opts": ["indicates a danger area", "is used to identify the characteristics of the light", "indicates the limits of the navigable channel", "serves no significant purpose"], "correct": 0, "expl": "Red sectors warn of shoals, rocks, or other hazards within that arc of bearings.", "ref": "Major Lights", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "What are the colors of a mid-channel daymark?", "opts": ["Black and red", "Green and Yellow", "Green and White", "Red and White"], "correct": 3, "expl": "Safe water daymarks are red and white octagons, matching the red/white vertical stripes of safe water buoys.", "ref": "Summary of Lateral Significance of Buoys and Beacons", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "What is a lighted safe water mark fitted with to aid in its identification?", "opts": ["A sequential number", "Red and white retroreflected material", "A spherical topmark", "Red and white octagon"], "correct": 2, "expl": "Safe water buoys may carry a single red spherical topmark. (The octagon is the daybeacon shape, not the buoy topmark.)", "ref": "Summary of Lateral Significance of Buoys and Beacons", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "A daybeacon is an unlighted fixed aid to navigation placed on shore or on marine sites and is identified by ________________.", "opts": ["its light characteristics and size", "the color and shapes of its dayboards", "its height and width", "its size and color"], "correct": 1, "expl": "Daybeacons are identified by their dayboards: e.g., green squares (port), red triangles (starboard), red-white octagons (safe water).", "ref": "Beacons", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "Which daymark shape is used in the lateral system?", "opts": ["Diamond", "Triangle", "Pentagon", "Semicircle"], "correct": 1, "expl": "Lateral daymarks are squares (green) and triangles (red). Diamonds are used for information/dangers, not lateral marking.", "ref": "Summary of Lateral Significance of Buoys and Beacons", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "Red lights may appear on ________________.", "opts": ["spherical buoys", "horizontally banded", "vertically stripped buoys", "yellow buoys"], "correct": 1, "expl": "Preferred-channel (horizontally banded) buoys show a light matching their top band, which can be red. Safe water buoys show white, special marks yellow.", "ref": "Summary of Lateral Significance of Buoys and buoys                           Beacons", "missed": false, "flag": false}, {"sec": "NG", "topic": "Aids to Navigation", "tag": "", "q": "A nun buoy will ____________________.", "opts": ["have an even number", "be cylindrical in shape", "be left to port when entering from seaward", "be green in color"], "correct": 0, "expl": "Nuns are red, cone-topped, even-numbered, and kept to starboard when returning from sea.", "ref": "Buoys", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Man Overboard Recovery", "tag": "", "q": "While underway in thick fog you are on watch and hear the cry \"man overboard.\" Which type maneuver should you make?", "opts": ["Racetrack Turn", "Round Turn", "Williamson Turn", "Figure Eight Turn"], "correct": 2, "expl": "When you can't see the person, the Williamson turn puts you back on a reciprocal course right down your own track line, the best place to search.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Man Overboard Recovery", "tag": "", "q": "A racetrack turn would be better than a Williamson turn in recovering a person overboard if _______________________.", "opts": ["the names of all crew members are unknown", "there is thick fog", "the water is very cold and the person is visible", "the person has been missing for a period of time"], "correct": 2, "expl": "The racetrack (two 180-degree turns) gets back to a visible person fastest, which matters in cold water. Williamson is for when the person isn't in sight.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Man Overboard Recovery", "tag": "", "q": "The key to rescuing a person overboard is ______________.", "opts": ["preparation, practice, and alertness", "a dedicated crew", "good equipment", "good communication"], "correct": 0, "expl": "Rescue success depends on drills and readiness so everyone reacts instantly; equipment and comms only help if the crew is prepared.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Man Overboard Recovery", "tag": "", "q": "A crew member has just fallen overboard off your port side. Which action should you take?", "opts": ["Immediately put the engines astern.", "Immediately put the rudder over hard left.", "Immediately put the rudder over hard right.", "Wait until the stern is well clear of the man and then put the rudder over hard right."], "correct": 1, "expl": "Turn toward the side the person fell from (port = hard left) to swing the stern and propeller away from them. Hook: 'rudder to the side they went over.'", "ref": "", "missed": true, "flag": false}, {"sec": "DGS", "topic": "Man Overboard Recovery", "tag": "", "q": "If the person overboard has not been located and immediately recovered and assistance from other boats is needed, the emergency radio call signal used would be ____________.", "opts": ["Security", "Pan-Pan", "Help Me", "Mayday"], "correct": 1, "expl": "Note: many authorities (and the USCG in practice) would treat an unrecovered person in the water as grave and imminent danger warranting MAYDAY; the exam bank keys PAN-PAN (urgency) since the vessel itself isn't in distress.", "ref": "", "missed": true, "flag": true}, {"sec": "DGS", "topic": "Man Overboard Recovery", "tag": "", "q": "You suspect that a crewmember has fallen overboard during the night and immediately execute a Williamson turn. What is the primary advantage of this maneuver under these circumstances? _________________.", "opts": ["The turn provides the maximum coverage of the area searched.", "You will be on a reciprocal course and nearly on the track-line run during the night.", "The turn enables you to reverse course in the shortest possible time.", "You have extra time to maneuver in attempting to close in on the person for rescue."], "correct": 1, "expl": "The Williamson turn returns you to your own wake on a reciprocal heading, ideal for retracing a track when the time of the fall is unknown.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Man Overboard Recovery", "tag": "", "q": "On a small boat, if someone fell overboard and you did not know which side the person fell, you should ________________.", "opts": ["first put the rudder hard over in either direction", "immediately reverse the engines", "increase speed to full to get the vessel away from the person", "stop the propellers from turning and throw a ring buoy over the side"], "correct": 3, "expl": "Without knowing the side, a turn could swing the prop into the person. Stop the screws to protect them and get flotation in the water right away.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Man Overboard Recovery", "tag": "", "q": "A person who sees someone fall overboard should ________________.", "opts": ["go to the bridge for distress flares", "call for help and keep the individual in sight", "immediately jump into the water to assist the individual", "run into the radio room to send an emergency signal"], "correct": 1, "expl": "Raise the alarm and never take your eyes off the victim (point continuously). Losing sight of a person in the water is the most common reason rescues fail.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Man Overboard Recovery", "tag": "", "q": "One of your crewmembers falls overboard from the starboard side. You should IMMEDIETLY _________________.", "opts": ["apply left rudder", "throw the crew member a life preserver", "position your vessel with to windward and begin recovery", "begin backing your engines"], "correct": 1, "expl": "Get flotation to the person at once; it keeps them afloat and marks the spot. (At the helm, also turn toward the side they fell from: starboard = right rudder.)", "ref": "", "missed": true, "flag": false}, {"sec": "DGS", "topic": "Man Overboard Recovery", "tag": "", "q": "You are standing wheelwatch when you hear the cry, man overboard from the starboard side. You should instinctively ___________.", "opts": ["give full left rudder", "put the rudder amidships", "give full right rudder", "throw a life ring to mark the spot"], "correct": 2, "expl": "Turn toward the side of the fall (starboard = right) so the stern and propeller swing away from the person.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Uninspected Passenger Vessel Regulations", "tag": "", "q": "Which approved lifesaving device is required for each person on-board a power-driven vessel carrying passengers? (Uninspected Vessel Regulations)", "opts": ["Buoyant vest", "Life jacket", "A life raft", "Buoyant cushion"], "correct": 1, "expl": "A six-pack carrying passengers for hire needs an approved wearable life jacket (Type I) for each person; vests and cushions don't satisfy that requirement.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Uninspected Passenger Vessel Regulations", "tag": "", "q": "A Safety Orientation Placard found on vessels carrying six or fewer passengers for hire contains information on all except...(Uninspected Vessel Regulations)", "opts": ["Proper method of donning and adjusting PFDs", "Stowage location of life preservers", "The location and contents of the Emergency Checkoff List", "The emergency radio call signal of the vessel"], "correct": 3, "expl": "The placard explains PFD donning, PFD stowage, and where the emergency checkoff list is; the call sign is not part of it.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Uninspected Passenger Vessel Regulations", "tag": "", "q": "An emergency check-off list is required on vessels carrying six or fewer passengers for hire. The list must contain information on all of the following EXCEPT _______________. (Uninspected Vessel Regulations)", "opts": ["actions required for crossing hazardous bars", "actions required in the event of accident", "actions required in the event of a fire at sea", "actions required in the event of a man overboard"], "correct": 1, "expl": "The checkoff list covers specific emergencies such as man overboard, fire, and heavy weather/hazardous bar crossings; a generic 'accident' isn't one of the listed items.", "ref": "", "missed": true, "flag": false}, {"sec": "DGS", "topic": "Uninspected Passenger Vessel Regulations", "tag": "", "q": "The required number of fire extinguishers to be carried on an uninspected \"motor vessel\" (less than 65 feet) is based on the vessel's _________. (Uninspected Vessel Regulations)", "opts": ["gross tonnage", "draft", "crew list", "length"], "correct": 3, "expl": "Extinguisher requirements for recreational and uninspected motorboats are tabulated by length class (under 26 ft, 26-40, 40-65).", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Uninspected Passenger Vessel Regulations", "tag": "", "q": "Each self-propelled, uninspected passenger vessel (UPV) carrying not more than six paying passengers must _____________________. (Uninspected Vessel Regulations)", "opts": ["not carry stowed emergency provisions", "be under the direction and control of an individual licensed by the USCG", "not run charter operations between sunrise and sunset", "not run charter operations between sunset and sunrise"], "correct": 1, "expl": "Carrying passengers for hire requires a credentialed operator; that's exactly what the OUPV/six-pack license authorizes.", "ref": "", "missed": false, "flag": false}, {"sec": "NG", "topic": "Charts & Chart Projections", "tag": "", "q": "Distance along a track line is measured on a Mercator chart by using the __________.", "opts": ["latitude or longitude scale at the middle of the scale", "longitude scale near the middle of the track line", "latitude scale at the mid-latitude of the chart", "latitude scale near the middle of the track line"], "correct": 3, "expl": "One minute of latitude = 1 nm, but Mercator scale stretches with latitude, so use the latitude scale level with the track's midpoint. Never use longitude.", "ref": "Types of Chart Projections", "missed": false, "flag": false}, {"sec": "NG", "topic": "Charts & Chart Projections", "tag": "", "q": "Charted depth is the __________.", "opts": ["average height of water over a specified period of time", "vertical distance from the chart sounding datum to the ocean bottom, plus the height of current", "average height of all low waters at a place", "vertical distance from the chart sounding datum to the ocean bottom"], "correct": 3, "expl": "Charted depth is measured from the sounding datum (e.g. MLLW) to the seabed. Actual depth = charted depth + height of tide.", "ref": "Depth", "missed": false, "flag": false}, {"sec": "NG", "topic": "Charts & Chart Projections", "tag": "", "q": "The only cylindrical chart projection widely used for navigation is the __________.", "opts": ["mercator", "gnomonic", "lambert conformal", "azimuthal"], "correct": 0, "expl": "The Mercator projects onto a cylinder, making rhumb lines straight, which is why it dominates navigational charts. Gnomonic is a plane projection used for great circles.", "ref": "Types of Chart Projections", "missed": false, "flag": false}, {"sec": "NG", "topic": "Charts & Chart Projections", "tag": "", "q": "Chart legends which indicate a conspicuous landmark are printed in __________.", "opts": ["italics", "capital letters", "boldfaced print", "underlined letters"], "correct": 1, "expl": "Conspicuous landmarks are labeled in CAPITAL letters so they stand out for visual fixes.", "ref": "Symbols & Abbreviations", "missed": false, "flag": false}, {"sec": "NG", "topic": "Charts & Chart Projections", "tag": "", "q": "The datum used for soundings on charts of the East Coast of the United States is __________.", "opts": ["mean low water springs", "mean lower low water", "half tide level", "mean low water"], "correct": 1, "expl": "NOAA uses Mean Lower Low Water (MLLW) as chart datum for all U.S. coasts, a conservative reference.", "ref": "Depth", "missed": false, "flag": false}, {"sec": "NG", "topic": "Charts & Chart Projections", "tag": "", "q": "A Mercator chart is a __________.", "opts": ["polyconic projection", "simple conic projection", "cylindrical projection", "rectangular projection"], "correct": 2, "expl": "Mercator is a cylindrical (conformal) projection; meridians and parallels appear as straight lines at right angles.", "ref": "Types of Chart Projections", "missed": false, "flag": false}, {"sec": "NG", "topic": "Charts & Chart Projections", "tag": "", "q": "What does the word “knot” mean?", "opts": ["One nautical mile", "One nautical mile per hour", "One degree on the longitude scale", "One degree on the latitude scale"], "correct": 1, "expl": "A knot is a unit of speed: 1 nautical mile per hour. Never say 'knots per hour.'", "ref": "Types of Chart Projections", "missed": false, "flag": false}, {"sec": "NG", "topic": "Charts & Chart Projections", "tag": "", "q": "On U.S. charts, you can tell if a named feature such as a rock is submerged by the __________.", "opts": ["dashed circle around feature", "magenta circle around the feature", "style of type used to print the name", "color of ink used to print the name"], "correct": 2, "expl": "Lettering style encodes it: italic (slanted) type for submerged/floating features, vertical (upright) type for features that are dry or above water.", "ref": "Symbols & Abbreviations", "missed": false, "flag": false}, {"sec": "NG", "topic": "Charts & Chart Projections", "tag": "", "q": "Which information is found in the chart title?", "opts": ["Variation information", "Chart sounding datum", "Revision and edition date", "Chart number"], "correct": 1, "expl": "The title block lists the projection, scale, and the datums for soundings and heights. Edition date and chart number are in the margins; variation is in the compass rose.", "ref": "Information and Symbols", "missed": false, "flag": false}, {"sec": "NG", "topic": "Charts & Chart Projections", "tag": "", "q": "Your chart indicates that there is an isolated rock and names the rock using vertical letters. This indicates the __________.", "opts": ["rock is a hazard to deep draft vessels only", "rock high and dry in water", "exact position of the rock is doubtful", "rock is visible at low water springs only"], "correct": 1, "expl": "Upright type marks features that are above water; italic would indicate a submerged feature. Hook: standing letters, standing rock.", "ref": "Symbols & Abbreviations", "missed": false, "flag": false}, {"sec": "DGS", "topic": null, "tag": "", "q": "To safely anchor a vessel there must be sufficient scope in the anchor cable. Scope is the ratio of_______________.", "opts": ["the length of the anchor line or anchor rode to the depth of the water", "the length of anchor to depth of water", "the weight of cable to weight of anchor", "the weight of cable to weight of vessel"], "correct": 0, "expl": "", "ref": "", "missed": false, "flag": false, "quiz": "Lesson 5 - Quiz"}, {"sec": "DGS", "topic": "Anchoring", "tag": "", "q": "The best method of determining if a vessel is dragging anchor is to note _________.", "opts": ["the amount of line paid out", "any change in the tautness of the anchor chain", "how much the vessel sheers while at anchor", "changes in bearings of fixed objects onshore"], "correct": 3, "expl": "Fixed shore bearings (or a GPS anchor alarm) that keep changing show you're moving; tension and sheering vary normally.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Anchoring", "tag": "", "q": "While anchoring your vessel, the best time to let go the anchor is when the vessel is...", "opts": ["making slight sternway due to wind or current", "moving fast astern over the ground", "moving fast ahead over the ground", "dead in the water"], "correct": 0, "expl": "Slight sternway lays the rode out along the bottom instead of piling it on the anchor, helping it set.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Anchoring", "tag": "", "q": "Using a scope of 6, determine how much anchor rode you should put out to anchor in 12 feet (3.7 meters) of water.", "opts": ["72 feet (21.9 meters)", "18 feet (5.5 meters)", "48 feet (14.6 meters)", "2 feet (0.6 meters)"], "correct": 0, "expl": "Rode = depth x scope = 12 x 6 = 72 ft. (In practice add bow height to depth.)", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Anchoring", "tag": "", "q": "Which part of the anchor actually digs into the bottom and provide holding power?", "opts": ["Fluke", "Stock", "Crown", "Shank"], "correct": 0, "expl": "The flukes bury into the bottom; the shank connects to the rode, and the stock keeps the anchor oriented.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Anchoring", "tag": "", "q": "The best method to stop a vessel from dragging anchor is to _________.", "opts": ["swing the rudder several times to work the anchor into the bottom", "back the engines", "pay out more anchor rode", "reduce the length of the cable"], "correct": 2, "expl": "More scope lowers the angle of pull so the flukes can bite; if that fails, reset or re-anchor.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Anchoring", "tag": "", "q": "A sufficient amount of anchor rode must be used when anchoring a vessel to ensure ____________.", "opts": ["the anchor flukes bite into the bottom of the seabed", "there is a sufficient scope of chain to keep the anchor on the bottom", "the vessel has enough room to swing while at anchor", "there is more chain out than there is in the chain locker"], "correct": 0, "expl": "Enough rode makes the pull nearly horizontal, letting the flukes bite and hold.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Anchoring", "tag": "", "q": "What is the normal length of anchor rode used to anchor a vessel?", "opts": ["Three to four times the depth of water", "Two times the depth of water", "An amount equal to the depth of the water", "Five to seven times the depth of water"], "correct": 3, "expl": "Standard practice is 5:1 to 7:1 scope (more in heavy weather; about 7:1 or 10:1 for storm conditions).", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Anchoring", "tag": "", "q": "When a small craft's anchor refuses to break free, the operator should ___________.", "opts": ["haul vertically on the line", "run in a wide circle, slowly, to change the angle of pull", "back down using the force of the engine", "increase the scope with the anchor line taut"], "correct": 1, "expl": "Circling slowly with the line short pulls the anchor from a different direction, often freeing a fouled fluke.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Anchoring", "tag": "", "q": "Which type of bottom, listed below, is best suited for holding an anchor of a small boat?", "opts": ["A mixture of mud and clay", "Gravel", "Loose sand", "Rock and coral"], "correct": 0, "expl": "Sticky mud/clay lets flukes bury and grip; loose sand, gravel and rock hold poorly.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Anchoring", "tag": "", "q": "By paying out more anchor rode, you_________.", "opts": ["increase the possibility that your vessel will drag anchor", "decrease the holding power of your anchor", "increase the holding power of your anchor", "decrease the swing of your vessel while at anchor"], "correct": 2, "expl": "More scope means a flatter pull on the anchor and better holding (at the cost of a larger swing circle).", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Anchoring", "tag": "", "q": "The holding power of an anchor at a given scope of cable increases when the ___________.", "opts": ["amount of chain lying along the bottom increases", "amount of chain lying along the bottom decreases", "length of the catenary is reduced", "mooring line tension is increased"], "correct": 0, "expl": "Chain on the bottom adds weight and friction and keeps the pull horizontal on the anchor.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Anchoring", "tag": "", "q": "The line connecting the anchor with a vessel is called _________.", "opts": ["rode", "scope", "vertical load", "windless"], "correct": 0, "expl": "The rode is the anchor line (rope, chain, or both); scope is the ratio of rode to depth.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Anchoring", "tag": "", "q": "The holding power of an anchor is primarily determined by the ___________.", "opts": ["anchor's ability to dig in", "shape of the anchor", "size of the vessel and its draft", "stowage of the anchor on board"], "correct": 0, "expl": "An anchor holds only as well as it penetrates and stays buried in the bottom.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Anchoring", "tag": "", "q": "The BEST method of protecting that portion of a fiber anchor line nearest the anchor from chafing on the bottom is by ____________.", "opts": ["replacing that portion with a short length of chain", "using a small scope ratio", "using a hockle to keep that portion of the anchor line off the bottom", "using a synthetic line"], "correct": 0, "expl": "A chain leader resists abrasion from rock and shells and also adds weight to lower the pull angle.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "A squeeze-grip type carbon-dioxide portable fire extinguisher has been partially discharged. It must ____________________.", "opts": ["replaced in its proper location if weight loss is no more than 25%", "replaced in its proper location regardless of weight", "replaced in its proper location if weight loss is no more than 15%", "labeled empty and recharged as soon as possible"], "correct": 3, "expl": "Any partially discharged extinguisher is treated as empty and recharged; you can't count on what's left in it.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "You can determine that a Carbon Dioxide fire extinguisher is fully charged by _______________.", "opts": ["checking the nameplate data", "weighing on a properly calibrated scale", "weighing by hand", "looking at the gauge"], "correct": 1, "expl": "CO2 extinguishers have no pressure gauge; charge is checked by weighing and comparing to the stamped full weight (recharge if more than 10% low).", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "The spread of fire is prevented by __________________.", "opts": ["increasing the oxygen supply", "turning on the ventilation system.", "cooling surfaces adjacent to the fire", "leaving combustibles in the endangered area"], "correct": 2, "expl": "Cooling adjacent bulkheads and decks blocks heat transfer by conduction and radiation, keeping neighboring materials below ignition temperature.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "The disadvantage of using CO2 is that the ________________________.", "opts": ["cylinders are regulated pressure vessels", "CO2 does not cool the fire", "C02 is not effective on class \"C\" fires", "C02 is not effective on class \"B\" fires"], "correct": 1, "expl": "CO2 smothers by displacing oxygen but removes little heat, so the fire can reflash once the gas disperses if fuel is still hot.", "ref": "", "missed": false, "flag": false}, {"sec": "DGS", "topic": "Firefighting", "tag": "", "q": "In addition to the heat, fuel, and oxygen what is required to have fire?", "opts": ["Electricity", "Chain Reaction", "Smoke", "Pressure"], "corr
